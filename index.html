<!doctype html>
<html lang="pt-BR" data-tema="b">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBFCFD">
<title>Painel CCAA Pelotas</title>
<link rel="icon" type="image/png" href="ccaa-logo.png">
<link rel="apple-touch-icon" href="ccaa-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Public+Sans:wght@400;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@600&family=Public+Sans:wght@400;600;700&display=swap"></noscript>
<style>
/* Estrutura do Painel CCAA. Cores e fontes vêm do tema (tema-a.css ou tema-b.css). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15.5px/1.55 var(--f-corpo); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--acc-txt); }
:focus-visible { outline: 2px solid var(--acc-txt); outline-offset: 2px; border-radius: 6px; }
.tn, .met-v, .lin-v, .col-v, .rot-n, .passo-n, .base b { font-variant-numeric: tabular-nums; }
.fundo { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: var(--fundo); }

/* status: uma cor por situação, sempre a mesma */
.st-assinaram { --s: var(--s-assinaram); --s-t: var(--s-assinaram-t); }
.st-esperando { --s: var(--s-esperando); --s-t: var(--s-esperando-t); }
.st-abordados { --s: var(--s-abordados); --s-t: var(--s-abordados-t); }
.st-nao { --s: var(--s-nao); --s-t: var(--s-nao-t); }
.st-cancel { --s: var(--s-cancel); --s-t: var(--s-cancel-t); }

/* cabeçalho: o único vidro fosco da página */
.top { position: sticky; top: 0; z-index: 20; background: var(--vidro); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 12px 20px 6px; display: flex; align-items: center; gap: 12px; }
.logo { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.brand { flex: 1; min-width: 0; }
.marca { margin: 0; font: var(--marca-peso) 17px/1.15 var(--f-tit); letter-spacing: var(--marca-esp); font-stretch: var(--marca-larg, 100%); }
.ref { margin: 1px 0 0; font-size: 12.5px; color: var(--mut); }
.lock { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
.lock:hover { border-color: var(--acc-txt); }
.lock .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-esperando); }
.lock.on .dot { background: var(--s-assinaram); }
.tabs { max-width: 1120px; margin: 0 auto; padding: 0 12px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; color: var(--mut); padding: 10px 10px 11px; font-size: 14.5px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--marca-cor); }

main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 48px; }
.panel.entra { animation: aparece .28s ease both; }
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
.foot { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; color: var(--mut); font-size: 12.5px; }

/* perguntas como títulos */
.q { margin: 0 0 14px; max-width: 70ch; }
.q h2 { margin: 0; font: var(--q-peso) var(--q-tam)/1.15 var(--f-tit); letter-spacing: var(--q-esp); font-stretch: var(--q-larg, 100%); }
.q-sub { margin: 4px 0 0; color: var(--mut); font-size: 14.5px; }
.fonte { margin: 3px 0 0; color: var(--mut); font-size: 12.5px; }
.bloco { margin: 0 0 40px; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 0 40px; }

/* frase-resposta */
.hero { position: relative; margin: 0 0 22px; }
.frase { margin: 0; max-width: 20ch; font: var(--frase-peso) var(--frase-tam)/1.02 var(--f-tit); letter-spacing: var(--frase-esp); font-stretch: var(--frase-larg, 100%); }
.frase em { font: var(--em-estilo) var(--em-peso) 1em/1 var(--f-em); letter-spacing: 0; color: var(--em-cor); }
.frase-sub { margin: 10px 0 0; color: var(--mut); font-size: 15px; max-width: 60ch; }
.carimbo { display: var(--carimbo, none); position: absolute; right: 0; top: -6px; width: 112px; height: 112px; color: var(--marca-cor); transform: rotate(-12deg); }

/* régua: a barra é o menu */
.regua { margin: 18px 0 0; }
.rotulos { position: relative; height: 50px; }
.rot { position: absolute; left: var(--c); transform: translateX(-50%); display: grid; gap: 0; border: 0; background: none; padding: 0 2px; cursor: pointer; text-align: center; white-space: nowrap; color: var(--ink); }
.rot-ini { left: 0; transform: none; text-align: left; }
.rot-fim { left: auto; right: 0; transform: none; text-align: right; }
.rotulos.cima .rot { bottom: 4px; }
.rotulos.baixo .rot { top: 4px; }
.rot-n { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; justify-content: inherit; }
.rot-ini .rot-n { justify-content: flex-start; } .rot-fim .rot-n { justify-content: flex-end; } .rot-meio .rot-n { justify-content: center; }
.rot-n svg { color: var(--s-t); }
.rot-n small { font-weight: 500; color: var(--mut); font-size: 12.5px; }
.rot-l { font-size: 12.5px; color: var(--mut); }
.rot[aria-pressed="true"] .rot-l { color: var(--s-t); font-weight: 700; }
.barra { display: flex; gap: 3px; height: var(--barra-alt); transform-origin: left center; animation: regua .9s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes regua { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.seg { border: 0; padding: 0; min-width: 6px; flex-grow: 0; flex-shrink: 1; background: var(--s); cursor: pointer; transition: opacity .2s, filter .2s; }
.seg:first-child { border-radius: var(--barra-r) 0 0 var(--barra-r); }
.seg:last-child { border-radius: 0 var(--barra-r) var(--barra-r) 0; }
.seg:hover { filter: brightness(1.12); }
.barra:has(.seg[aria-pressed="true"]) .seg:not([aria-pressed="true"]) { opacity: .42; }
.regua-marcas { display: var(--marcas, none); position: relative; height: 16px; margin-top: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%) left top / 100% 7px no-repeat; }

/* linha de números estilo aba */
.metricas { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 0 26px; }
.met { border: 0; background: none; text-align: left; padding: 14px 16px 12px; cursor: pointer; display: grid; gap: 2px; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.met + .met { border-left: 1px solid var(--line); }
.met-r { font-size: 13px; color: var(--mut); font-weight: 600; }
.met-v { font: var(--num-peso) 30px/1.1 var(--f-num); letter-spacing: var(--num-esp); font-stretch: var(--num-larg, 100%); }
.met:hover .met-r { color: var(--ink); }
.met.on { border-bottom-color: var(--acc); }
.met.on .met-r { color: var(--ink); }

/* linhas com barra atrás do texto */
.visao { transition: opacity .14s; }
.visao.saindo, .visao.chegando { opacity: 0; }
.lins { display: grid; gap: 4px; }
.lin { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(54px, auto); gap: 14px; align-items: center; padding: 9px 12px; min-height: 42px; border-radius: var(--r-lin); overflow: hidden; }
.lin-bar { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p)); background: color-mix(in srgb, var(--s, var(--acc)) var(--lin-forca), transparent); border-radius: var(--r-lin); animation: cresce .8s cubic-bezier(.2, .7, .2, 1) both; }
.lin-bar.forte { background: color-mix(in srgb, var(--s, var(--acc)) calc(var(--lin-forca) * 2.4), transparent); }
@keyframes cresce { from { transform: scaleX(0); } }
.lin > span:not(.lin-bar) { position: relative; z-index: 1; }
.lin-t { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.lin-t small { display: block; font-weight: 400; color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin-v { font-weight: 700; text-align: right; white-space: nowrap; }
.lin-v small { font-weight: 400; color: var(--mut); }
.lin-x { text-align: right; color: var(--mut); font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.lin[role="button"] { cursor: pointer; }
.lin[role="button"]:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.var { font-weight: 700; font-size: 12.5px; }
.var.sobe { color: var(--s-assinaram-t); } .var.desce { color: var(--s-cancel-t); }
.spark { color: var(--mut); flex: none; }
.acoes { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

/* colunas */
.colunas { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; align-items: end; height: 210px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.col-b { width: 72%; max-width: 46px; height: calc(var(--p) * 150px); min-height: 2px; background: var(--col-cor); border-radius: var(--col-r) var(--col-r) 2px 2px; transform-origin: bottom; animation: sobe .8s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes sobe { from { transform: scaleY(0); } }
.col.rec .col-b { background: var(--acc); }
.col-v { font-size: 12.5px; font-weight: 700; margin-bottom: 4px; }
.col-x { font-size: 12px; color: var(--mut); margin-top: 6px; white-space: nowrap; }
.anota { margin: 10px 0 0; font-size: 13.5px; color: var(--mut); }

/* o que fazer, base */
.passos { display: grid; gap: 8px; }
.passo { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surf); border-radius: var(--r); padding: 12px 16px; cursor: pointer; transition: border-color .15s; }
.passo:hover { border-color: var(--acc); }
.passo-n { font: var(--num-peso) 32px/1 var(--f-num); letter-spacing: var(--num-esp); font-stretch: var(--num-larg, 100%); color: var(--acc-txt); }
.passo-t { font-size: 15px; }
.base { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.base p { margin: 0; color: var(--mut); }
.base b { color: var(--ink); font: var(--num-peso) 26px/1 var(--f-num); letter-spacing: var(--num-esp); font-stretch: var(--num-larg, 100%); margin-right: 4px; }

/* pessoas */
.lista, .mini-lista { display: grid; gap: 0; border-top: 1px solid var(--line); }
.mini-lista { margin-top: 14px; }
.pes { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) minmax(0, 1.2fr) auto; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.mini-lista .pes { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) minmax(0, 1.2fr) auto; }
.pes-q, .pes-s, .pes-c { min-width: 0; }
.pes-q b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pes small { display: block; color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pes-c span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.pes-s { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.pes-s small { flex-basis: 100%; }
.pes-a { display: flex; gap: 6px; }
.ic { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); display: inline-grid; place-items: center; color: var(--mut); background: var(--surf); text-decoration: none; }
.ic:hover { color: var(--acc-txt); border-color: var(--acc-txt); }
.ic.wa { background: #1f9d55; border-color: #1f9d55; color: #fff; }
.ic.wa:hover { background: #17864a; color: #fff; }
.ic.off { opacity: .25; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; color: var(--s-t); background: color-mix(in srgb, var(--s) 16%, transparent); }
.tag svg { width: 13px; height: 13px; }
.tag-neutra { color: var(--mut); background: color-mix(in srgb, var(--ink) 7%, transparent); }
.tag-fam { color: var(--acc-txt); background: color-mix(in srgb, var(--acc) 15%, transparent); }

/* filtros */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 12px; }
.bar.entre { justify-content: space-between; }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 10px; background: var(--surf); outline: none; }
.search input:focus { border-color: var(--acc-txt); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mut); }
select.sel { padding: 9px 30px 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surf) var(--seta) no-repeat right 11px center; appearance: none; cursor: pointer; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.bar .chips + .chips { padding-left: 10px; border-left: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.chip svg { width: 13px; height: 13px; color: var(--s-t, currentColor); }
.chip:hover { border-color: var(--mut); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] svg { color: inherit; }
.count { margin: 0 0 8px; font-size: 13.5px; color: var(--mut); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surf); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--acc-txt); color: var(--acc-txt); }
.btn.pri { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
.btn.pri:hover { color: var(--on-acc); filter: brightness(1.08); }
.empty { padding: 26px 8px; color: var(--mut); margin: 0; }
.seg-ctl { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 7%, transparent); margin: 0 0 16px; }
.seg-ctl button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--mut); cursor: pointer; }
.seg-ctl button[aria-pressed="true"] { background: var(--surf); color: var(--ink); }

/* cofre */
.vault { max-width: 540px; padding: 26px 0 8px; }
.vault .lk { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--acc-txt); background: color-mix(in srgb, var(--acc) 14%, transparent); margin-bottom: 12px; }
.vault-t { margin: 0 0 6px; font: var(--q-peso) 21px/1.2 var(--f-tit); font-stretch: var(--q-larg, 100%); }
.vault-s { margin: 0 0 14px; color: var(--mut); }
.vault form { display: flex; gap: 8px; flex-wrap: wrap; }
.vault input { flex: 1 1 220px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surf); }

/* tabela */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child { text-align: left; }
.tbl thead th { color: var(--mut); font-weight: 600; font-size: 13px; }
.tbl tbody th { font-weight: 600; }
.nd { color: var(--mut); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 24px); opacity: 0; background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  .top-in { padding: 10px 16px 4px; gap: 10px; }
  .logo { width: 34px; height: 34px; }
  .lock .txt { display: none; }
  .lock { padding: 10px; }
  main { padding: 18px 16px 36px; }
  .carimbo { width: 74px; height: 74px; top: -4px; }
  .metricas { grid-template-columns: repeat(2, 1fr); }
  .met:nth-child(3) { border-left: 0; }
  .met:nth-child(n+3) { border-top: 1px solid var(--line); }
  .met { padding: 11px 12px 9px; }
  .met-v { font-size: 25px; }
  .rot-n { font-size: 14px; }
  .rot-l { font-size: 11.5px; }
  .lin { grid-template-columns: minmax(0, 1fr) auto; }
  .lin-x { grid-column: 1 / -1; justify-content: flex-start; margin-top: -6px; font-size: 12.5px; }
  .pes, .mini-lista .pes { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .pes-a { grid-column: 2; grid-row: 1 / span 3; flex-direction: column; align-self: center; }
  .pes-q, .pes-s, .pes-c { grid-column: 1; }
  .colunas { gap: 3px; }
  .col-v { font-size: 11px; }
  .col-x { font-size: 10.5px; }
  .passo { grid-template-columns: 58px 1fr; padding: 11px 13px; }
  .passo-n { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* listas de rematrícula (A, B, C): composição de cada lista, em ordem fixa, sem ranking */
.listas { display: grid; gap: 18px; }
.lista-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 7px; flex-wrap: wrap; }
.lista-n { font-weight: 700; font-size: 15.5px; }
.lista-n small { font-weight: 400; color: var(--mut); font-size: 13px; margin-left: 8px; }
.lista-v { color: var(--mut); font-size: 14px; }
.lista-v b { color: var(--ink); font-size: 16px; }
.lista-v small { font-size: 13px; }
.mini-barra { display: flex; gap: 2px; height: 14px; border-radius: 99px; overflow: hidden; transform-origin: left; animation: regua .8s cubic-bezier(.2, .7, .2, 1) both; }
.mini-barra i { display: block; background: var(--s); min-width: 2px; }
.mini-barra.foco i:not(.on) { opacity: .3; }

/* Direção B: "Caderno". Papel branco frio, tinta azul-escura do logo, um acento só (azul #029CDC);
   o vermelho #C62219 fica para a marca. Newsreader nos títulos em pergunta e nos números da frase,
   Public Sans no corpo. Elemento próprio: a régua com marcas de 10% sob a barra. */
:root {
  --bg: #FBFCFD; --surf: #FFFFFF; --ink: #13263F; --mut: #566577; --line: #DFE5EC;
  --acc: #029CDC; --acc-txt: #0A6FA3; --on-acc: #FFFFFF; --marca-cor: #C62219;
  --vidro: color-mix(in srgb, #FBFCFD 72%, transparent);
  --fundo: radial-gradient(40rem 22rem at 92% -10%, rgba(2, 156, 220, .14), transparent 70%),
           radial-gradient(26rem 18rem at 4% -8%, rgba(198, 34, 25, .07), transparent 70%), #FBFCFD;
  --s-assinaram: #2E9E6A; --s-assinaram-t: #1B7A4E;
  --s-esperando: #C98A0B; --s-esperando-t: #8A5A00;
  --s-abordados: #029CDC; --s-abordados-t: #0A6FA3;
  --s-nao: #8792A0; --s-nao-t: #56606C;
  --s-cancel: #B0378A; --s-cancel-t: #9A2577;
  --f-corpo: 'Public Sans', 'Segoe UI', sans-serif; --f-tit: 'Newsreader', Georgia, serif;
  --f-num: 'Public Sans', 'Segoe UI', sans-serif; --f-em: 'Newsreader', Georgia, serif;
  --marca-peso: 600; --marca-esp: 0;
  --frase-peso: 600; --frase-tam: clamp(2.1rem, 5.6vw, 3.6rem); --frase-esp: -.015em;
  --em-estilo: normal; --em-peso: 600; --em-cor: var(--ink);
  --q-peso: 600; --q-tam: clamp(1.35rem, 2.6vw, 1.7rem); --q-esp: -.01em;
  --num-peso: 700; --num-esp: -.02em;
  --barra-alt: clamp(40px, 7vw, 56px); --barra-r: 6px; --r: 10px; --r-lin: 6px; --col-r: 4px;
  --lin-forca: 16%; --col-cor: #C5CED8; --carimbo: none; --marcas: block;

      <label class="search">${IC.busca}<input id="q-i" type="search" placeholder="Buscar aluno, responsável ou nível" value="${esc(fI.q)}" aria-label="Buscar"></label>
      <select class="sel" id="s-ifam" aria-label="Curso">${opts([['todos', 'Todos os cursos'], ...fams.map((l) => [l, l])], fI.fam)}</select>
      <select class="sel" id="s-isem" aria-label="Semestre">${opts([['todos', 'Todos os semestres'], ...sems.map((s) => [s, 'Parou em ' + semRot(s)])], fI.sem)}</select>
    </div>
    <div class="bar">
      ${chips('contato', [['nao', 'Nunca contatados'], ['sim', 'Já contatados'], ['todos', 'Contatados ou não']], fI.contato)}
      ${chips('extra', [['todos', 'Todos'], ['recentes', 'Pararam de 2025 para cá'], ['familia', 'Família ainda no CCAA']], fI.extra)}
    </div>
    <div class="bar entre"><p class="count">${nf(L.length)} contatos, ${nf(comTel)} com WhatsApp.</p><button class="btn" type="button" id="b-copia">${IC.copia}Copiar ${nf(comTel)} números</button></div>
    <div class="lista">${L.slice(0, fI.n).map((x) => `
      <div class="pes">
        <div class="pes-q"><b>${esc(x.nome)}</b><small>${esc(x.nivel)}, parou em ${esc(semRot(x.parou))}${x.idade ? ', ' + x.idade + ' anos' : ''}</small></div>
        <div class="pes-s">${x.familia ? '<span class="tag tag-fam">Família no CCAA</span>' : ''}<span class="tag tag-neutra">${esc(x.status)}</span></div>
        <div class="pes-c"><span>${esc(x.quem)}</span><small>${esc(x.parent || 'Contato')}</small></div>
        <div class="pes-a">${linkWa(x.wa)}${linkPlan(PRIV.gid.inativos, x.linha)}</div>
      </div>`).join('') || '<p class="empty">Nenhum contato com esses filtros. Troque o curso, o semestre ou limpe a busca.</p>'}</div>
    ${L.length > fI.n ? `<div class="acoes"><button class="btn" type="button" id="b-mais">Mostrar mais ${nf(Math.min(60, L.length - fI.n))} de ${nf(L.length - fI.n)}</button></div>` : ''}`;
  }

  // ---------- HISTÓRICO ----------
  function historico() {
    const H = PUB.hist;
    const ult = H.anos.length - 1;
    const maxT = Math.max(...H.total);
    const maxM = Math.max(...H.meses.map((m) => m[1]));
    const mesAtual = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][new Date().getMonth()];
    const totalAno = H.meses.reduce((s, m) => s + m[1], 0);
    const cursos = H.cursos.map((c) => ({ nome: c[0], v: c[1], d: c[1][ult] - c[1][ult - 1], tot: c[1].reduce((s, x) => s + x, 0) })).sort((a, b) => b.v[ult] - a.v[ult]);
    const maxU = Math.max(...cursos.map((c) => c.v[ult]));
    const temps = [...new Set(PUB.ritmo.map((r) => r.temporada))];
    const meses = ['out', 'nov', 'dez', 'jan', 'fev'];
    const R = (t, m) => (PUB.ritmo.find((r) => r.temporada === t && r.mes === m) || {}).rematriculas;
    const somaT = (t) => meses.reduce((s, m) => s + (R(t, m) || 0), 0);
    const fonteM = 'Fonte: Sponte, relatório Gerencial de Matrículas, lido em 07/11/2026.';
    const spark = (v) => { const mx = Math.max(...v, 1); const pts = v.map((x, i) => `${(i / (v.length - 1) * 60).toFixed(1)},${(18 - x / mx * 16).toFixed(1)}`).join(' '); return `<svg class="spark" width="60" height="20" viewBox="0 0 60 20" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`; };
    return `<div class="duas">
      <section class="bloco">${titulo('Quantas matrículas novas fizemos por ano?', 'Ano comercial de outubro a setembro. O primeiro começa em 23/10/2021.', fonteM)}
        <div class="colunas" style="--n:${H.anos.length}">${H.anos.map((a, i) => `<div class="col${i === ult ? ' rec' : ''}"><span class="col-v">${H.total[i]}</span><span class="col-b" style="--p:${(H.total[i] / maxT).toFixed(4)}"></span><span class="col-x">${esc(a)}</span></div>`).join('')}</div></section>
      <section class="bloco">${titulo('Em que meses as matrículas acontecem?', `Soma de cinco anos. Janeiro a março concentra ${pct(H.meses.slice(0, 3).reduce((s, m) => s + m[1], 0), totalAno)}% do ano; em destaque, o mês atual.`, fonteM)}
        <div class="colunas" style="--n:12">${H.meses.map((m) => `<div class="col${m[0] === mesAtual ? ' rec' : ''}"><span class="col-v">${m[1]}</span><span class="col-b" style="--p:${(m[1] / maxM).toFixed(4)}"></span><span class="col-x">${esc(m[0])}</span></div>`).join('')}</div></section></div>
    <section class="bloco">${titulo('Quais cursos trazem mais alunos novos?', `Matrículas novas em ${esc(H.anos[ult])}, a variação contra ${esc(H.anos[ult - 1])} e a linha dos cinco anos.`, fonteM)}
      <div class="lins">${cursos.map((c) => linha(esc(c.nome), nf(c.v[ult]), c.v[ult] / maxU,
        `<span class="var ${c.d > 0 ? 'sobe' : c.d < 0 ? 'desce' : ''}">${c.d > 0 ? '▲ +' + c.d : c.d < 0 ? '▼ ' + c.d : '0'}</span>${spark(c.v)}`)).join('')}</div></section>
    <section class="bloco">${titulo('Quando as rematrículas acontecem?', 'Contratos de rematrícula por mês, de outubro a fevereiro de cada temporada.', 'Fonte: Sponte, relatório Gerencial, lido em 02/11/2026.')}
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Temporada</th>${meses.map((m) => `<th scope="col">${m}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>${temps.map((t) => `<tr><th scope="row">${esc(t)}</th>${meses.map((m) => { const v = R(t, m); return `<td>${v == null ? '<span class="nd">sem dado</span>' : nf(v)}</td>`; }).join('')}<td><b>${nf(somaT(t))}</b></td></tr>`).join('')}</tbody></table></div></section>`;
  }

  // ---------- navegação ----------
  const TELAS = { resumo, assinaturas, rematricula, inativos, historico };
  let atual = 'resumo';
  function render(tab, suave) {
    const p = $('#p-' + tab);
    p.innerHTML = TELAS[tab]();
    if (!suave) { p.classList.remove('entra'); void p.offsetWidth; p.classList.add('entra'); contar(p); }
    ligaCofre(p);
    liga(tab, p);
  }
  function ir(tab, filtro) {
    if (filtro === 'familia') Object.assign(fI, { extra: 'familia', contato: 'todos', fam: 'todos', sem: 'todos', q: '', n: 60 });
    if (filtro === 'recentes') Object.assign(fI, { extra: 'recentes', contato: 'nao', fam: 'todos', sem: 'todos', q: '', n: 60 });
    if (tab === 'rematricula' && filtro) Object.assign(fR, { vista: 'alunos', st: filtro === 'falta' ? 'todos' : filtro, q: '', lista: 'todas', fam: 'todos' });
    atual = tab;
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    document.querySelectorAll('.panel').forEach((p) => { p.hidden = p.id !== 'p-' + tab; });
    try { history.replaceState(null, '', '#' + tab); } catch (e) { /* ok */ }
    render(tab);
    window.scrollTo({ top: 0, behavior: reduz() ? 'auto' : 'smooth' });
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => ir(b.dataset.tab)));

  function trocaSuave(tab, fn) {
    const v = $('#visao') || $('#p-' + tab);
    v.classList.add('saindo');
    setTimeout(() => { fn(); const n = $('#visao'); if (n) { n.classList.add('chegando'); requestAnimationFrame(() => n.classList.remove('chegando')); } }, reduz() ? 0 : 140);
  }
  function liga(tab, p) {
    p.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => ir(b.dataset.ir, b.dataset.filtro)));
    p.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', () => {
      if (selR === b.dataset.sel) return;
      selR = b.dataset.sel;
      const y = window.scrollY;
      trocaSuave(tab, () => { render(tab, true); window.scrollTo(0, y); });
    }));
    const F = { assinaturas: fA, rematricula: fR, inativos: fI }[tab];
    if (!F) return;
    p.querySelectorAll('[data-doc]').forEach((b) => b.addEventListener('click', () => { fA.doc = b.dataset.doc; render(tab, true); }));
    p.querySelectorAll('.chips').forEach((g) => g.addEventListener('click', (ev) => {
      const c = ev.target.closest('.chip'); if (!c) return;
      F[g.dataset.grupo] = c.dataset.v; if (F === fI) fI.n = 60; render(tab, true);
    }));
    p.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => { fR.vista = b.dataset.vista; render(tab, true); }));
    p.querySelectorAll('[data-turma]').forEach((b) => {
      const vai = () => { Object.assign(fR, { vista: 'alunos', q: b.dataset.turma, st: 'todos', lista: 'todas', fam: 'todos' }); render(tab, true); };
      b.addEventListener('click', vai);
      b.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); vai(); } });
    });
    const sel = (id, campo) => { const s = $(id, p); if (s) s.addEventListener('change', () => { F[campo] = s.value; if (F === fI) fI.n = 60; render(tab, true); }); };
    sel('#s-lista', 'lista'); sel('#s-fam', 'fam'); sel('#s-ifam', 'fam'); sel('#s-isem', 'sem');
    const busca = (id) => {
      const i = $(id, p); if (!i) return;
      i.addEventListener('input', () => {
        clearTimeout(busca.h);
        busca.h = setTimeout(() => {
          F.q = i.value; if (F === fI) fI.n = 60; const pos = i.selectionStart; render(tab, true);
          const n = $(id, $('#p-' + tab)); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ok */ }
        }, 180);
      });
    };
    busca('#q-r'); busca('#q-i');
    const mais = $('#b-mais', p);
    if (mais) mais.addEventListener('click', () => { const y = window.scrollY; fI.n += 60; render(tab, true); window.scrollTo(0, y); });
    const cp = $('#b-copia', p);
    if (cp) cp.addEventListener('click', async () => {
      const nums = [...new Set((inativos.lista || []).filter((x) => x.wa).map((x) => '+' + x.wa))];
      try { await navigator.clipboard.writeText(nums.join('\n')); toast(nf(nums.length) + ' números copiados'); }
      catch (e) { toast('Este navegador bloqueou a cópia. Tente pelo Chrome.'); }
    });
  }

  // ---------- início ----------
  (async () => {
    const hash = location.hash || '';
    const k = chaveDe(hash);
    const tab = (hash.match(/^#(resumo|assinaturas|rematricula|inativos|historico)$/) || [])[1] || 'resumo';
    if (k) {
      const ok = await abrir(k);
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      if (ok) toast('Contatos abertos neste aparelho');
    } else {
      let salvo = null;
      try { salvo = localStorage.getItem(CHAVE_LS); } catch (e) { /* ok */ }
      if (salvo && !(await abrir(salvo))) { try { localStorage.removeItem(CHAVE_LS); } catch (e) { /* ok */ } }
    }
    pintaLock();
    ir(tab);
    window.addEventListener('hashchange', async () => {
      const k2 = chaveDe(location.hash);
      if (!k2) return;
      const ok2 = await abrir(k2);
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      pintaLock(); render(atual); toast(ok2 ? 'Contatos abertos neste aparelho' : 'Link não reconhecido. Confira se colou o link inteiro.');
    });
  })();
})();

</script>
</body>
</html>
