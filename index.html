<!doctype html>
<html lang="pt-BR" data-tema="c">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F3F4F6">
<title>Dashboard CCAA Pelotas</title>
<link rel="icon" type="image/png" href="ccaa-logo.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCAA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Instrument+Serif&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Instrument+Serif&display=swap"></noscript>
<style>
/* Estrutura do Dashboard CCAA. Cores e fontes vêm do tema (tema-c.css). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-corpo); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body.sem-rolar { overflow: hidden; }
button, input { font: inherit; color: inherit; }
a { color: var(--acc-txt); }
:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }
mark { background: color-mix(in srgb, var(--acc) 22%, transparent); color: inherit; padding: 0 1px; border-radius: 2px; }

.st-assinaram { --s: var(--s-assinaram); --s-t: var(--s-assinaram-t); }
.st-esperando { --s: var(--s-esperando); --s-t: var(--s-esperando-t); }
.st-aberto { --s: var(--s-aberto); --s-t: var(--s-aberto-t); }
.st-cancel { --s: var(--s-cancel); --s-t: var(--s-cancel-t); }

/* cabeçalho: o único vidro da página */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 78%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; padding: 14px 24px 4px; display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; border-radius: 8px; flex: none; }
.marca { flex: 1; margin: 0; font: 400 24px/1 var(--f-tit); letter-spacing: -.005em; }
.marca span { font: 500 13px/1 var(--f-corpo); color: var(--mut); margin-left: 6px; letter-spacing: .01em; }
.b-busca { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--surf); border-radius: 999px; padding: 8px 16px 8px 12px; font-size: 14px; color: var(--ink2); cursor: pointer; transition: border-color .15s; }
.b-busca:hover { border-color: var(--ink); }
.tabs { max-width: 1120px; margin: 0 auto; padding: 0 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; background: none; color: var(--mut); padding: 12px 8px 12px; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 1px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

main { max-width: 1120px; margin: 0 auto; padding: 44px 24px 96px; }
.panel.entra { animation: aparece .3s ease both; }
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }

/* títulos em pergunta */
.q { margin: 0 0 22px; max-width: 68ch; }
.q h2 { margin: 0; font: 400 clamp(1.7rem, 3.2vw, 2.15rem)/1.12 var(--f-tit); letter-spacing: -.005em; }
.q-sub { margin: 6px 0 0; color: var(--mut); font-size: 14.5px; }
.bloco { margin: 0 0 88px; }
.duas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 0 56px; }

/* frase-resposta e barra central */
.hero { margin: 0 0 40px; }
.frase { margin: 0; max-width: 18ch; font: 400 clamp(2.6rem, 6.6vw, 4.8rem)/1.02 var(--f-tit); letter-spacing: -.012em; }
.frase .n-ok { color: var(--s-assinaram-t); }
.frase-sub { margin: 14px 0 0; color: var(--mut); font-size: 15px; max-width: 60ch; }
.regua { margin: 34px 0 0; }
.rotulos { position: relative; height: 48px; }
.rot { position: absolute; left: var(--c); transform: translateX(-50%); display: grid; border: 0; background: none; padding: 0 2px; cursor: pointer; text-align: center; white-space: nowrap; color: var(--ink); }
.rot-ini { left: 0; transform: none; text-align: left; }
.rot-fim { left: auto; right: 0; transform: none; text-align: right; }
.rotulos.cima .rot { bottom: 6px; }
.rotulos.baixo .rot { top: 6px; }
.rot-n { font: 400 22px/1.05 var(--f-tit); }
.rot-n small { font: 400 12.5px var(--f-corpo); color: var(--mut); margin-left: 5px; }
.rot-l { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--mut); justify-content: inherit; }
.rot-ini .rot-l { justify-content: flex-start; } .rot-meio .rot-l { justify-content: center; } .rot-fim .rot-l { justify-content: flex-end; }
.rot-l i, .tag i { width: 7px; height: 7px; border-radius: 50%; background: var(--s, var(--mut)); flex: none; }
.rot[aria-pressed="true"] .rot-l { color: var(--s-t); font-weight: 600; }
.barra { display: flex; gap: 2px; height: clamp(40px, 7vw, 56px); transform-origin: left center; animation: regua 1s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes regua { from { transform: scaleX(0); } }
.seg { border: 0; padding: 0; min-width: 5px; flex-grow: 0; flex-shrink: 1; background: var(--s); cursor: pointer; transition: opacity .25s; }
.barra:has(.seg[aria-pressed="true"]) .seg:not([aria-pressed="true"]) { opacity: .35; }

/* números que funcionam como abas */
.metricas { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); margin: 0 0 72px; }
.met { border: 0; background: none; text-align: left; padding: 18px 20px 16px; cursor: pointer; display: grid; gap: 4px; position: relative; }
.met + .met { border-left: 1px solid var(--line); }
.met::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: transparent; }
.met.on::after { background: var(--ink); }
.met-r { font-size: 13px; color: var(--mut); }
.met-v { font: 400 40px/1 var(--f-tit); }
.met:hover .met-r { color: var(--ink); }

/* listas A, B, C */
.visao { transition: opacity .12s; }
.visao.saindo { opacity: 0; }
.listas { display: grid; gap: 26px; }
.lista-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 9px; flex-wrap: wrap; }
.lista-n { font-weight: 600; font-size: 15px; }
.lista-n small { font-weight: 400; color: var(--mut); font-size: 14px; margin-left: 8px; }
.lista-v { color: var(--mut); font-size: 14px; }
.lista-v b { color: var(--ink); font: 400 24px/1 var(--f-tit); margin-right: 3px; }
.mini-barra { display: flex; gap: 2px; height: 10px; transform-origin: left; animation: regua .9s cubic-bezier(.2, .7, .2, 1) both; }
.mini-barra i { display: block; background: var(--s); min-width: 2px; opacity: .28; transition: opacity .25s; }
.mini-barra i.on { opacity: 1; }
.acoes { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }

/* o que fazer agora */
.passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.passo { display: grid; grid-template-rows: auto auto auto 1fr auto; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--surf); border-radius: 4px; padding: 26px 26px 22px; cursor: pointer; transition: border-color .2s, transform .2s; min-height: 250px; }
.passo:hover { border-color: var(--ink); transform: translateY(-2px); }
.passo-i { color: var(--ink2); margin-bottom: 14px; }
.passo-n { font: 400 54px/1 var(--f-tit); }
.passo-t { font-weight: 600; font-size: 15.5px; margin-top: 10px; }
.passo-d { color: var(--mut); font-size: 14px; }
.passo-l { margin-top: 18px; font-size: 13.5px; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.base { display: flex; flex-wrap: wrap; gap: 12px 56px; }
.base p { margin: 0; color: var(--mut); font-size: 14px; }
.base b { display: block; color: var(--ink); font: 400 44px/1.05 var(--f-tit); }

/* filtros: o mesmo padrão em todas as abas */
.filtros { display: grid; gap: 10px; margin: 0 0 26px; padding: 4px 0 18px; border-bottom: 1px solid var(--line); }
.filtro { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: baseline; gap: 12px; }
.filtro-r { font-size: 12.5px; color: var(--mut); padding-top: 4px; }
.filtro-o { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.op { border: 0; background: none; padding: 4px 0; font-size: 14px; color: var(--mut); cursor: pointer; border-bottom: 1px solid transparent; }
.op small { font-size: 11.5px; margin-left: 5px; color: var(--mut); }
.op:hover { color: var(--ink); }
.op[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.busca { position: relative; display: block; margin-bottom: 8px; }
.busca svg { position: absolute; left: 0; top: 50%; transform: translateY(-50%); color: var(--mut); }
.busca input { width: 100%; padding: 10px 4px 10px 30px; border: 0; border-bottom: 1px solid var(--line2); background: transparent; outline: none; font-size: 15.5px; border-radius: 0; }
.busca input:focus { border-bottom-color: var(--ink); }
.busca input::placeholder { color: #8a8a8a; }
.count { margin: 0 0 10px; font-size: 13.5px; color: var(--mut); }
.count-l { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.abas2 { display: flex; gap: 22px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }
.abas2 button { border: 0; background: none; padding: 8px 0 10px; font-size: 15px; color: var(--mut); cursor: pointer; border-bottom: 1.5px solid transparent; margin-bottom: -1px; }
.abas2 button small { font-size: 12px; margin-left: 6px; }
.abas2 button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.lnk { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 2px 0; font-size: 14px; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.lnk:hover { color: var(--acc-txt); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line2); background: var(--surf); border-radius: 2px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.pri { background: var(--ink); color: #fff; border-color: var(--ink); }

/* pessoas */
.lista { background: var(--surf); border: 1px solid var(--line); border-radius: 4px; }
.grupo { margin: 0; padding: 18px 18px 8px; font-size: 13px; font-weight: 600; color: var(--ink2); border-bottom: 1px solid var(--line); background: var(--bg); }
.lista .grupo:first-child { border-radius: 4px 4px 0 0; }
.grupo small { font-weight: 400; color: var(--mut); margin-left: 8px; }
.pes { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.25fr) minmax(0, 1.15fr) auto; gap: 16px; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.pes:last-child { border-bottom: 0; }
.pes-q, .pes-s, .pes-c { min-width: 0; }
.pes-q b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pes small { display: block; color: var(--mut); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pes-c span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14.5px; }
.pes-s { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: center; }
.pes-s small { flex-basis: 100%; }
.pes-a { display: flex; gap: 6px; }
.ic { width: 38px; height: 38px; border-radius: 2px; border: 1px solid var(--line2); display: inline-grid; place-items: center; color: var(--ink2); background: var(--surf); text-decoration: none; }
.ic:hover { border-color: var(--ink); }
.ic.wa { background: #1f9d55; border-color: #1f9d55; color: #fff; }
.ic.wa:hover { background: #17864a; }
.ic.off { color: var(--line2); }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; color: var(--s-t, var(--mut)); }
.tag-neutra { --s: #9AA0A8; color: var(--mut); }
.tag-fam { --s: var(--acc); color: var(--acc-txt); }
.oferta { flex-basis: 100%; font-size: 14px; color: var(--ink); }
.empty { padding: 28px 18px; color: var(--mut); margin: 0; }

/* linhas com barra proporcional atrás */
.lins { display: grid; gap: 2px; }
.lin { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(64px, auto); gap: 16px; align-items: center; padding: 11px 14px; min-height: 48px; overflow: hidden; }
.lin-bar { position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--p)); background: color-mix(in srgb, var(--s, var(--acc)) 16%, transparent); animation: cresce .8s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes cresce { from { transform: scaleX(0); } }
.lin > span:not(.lin-bar) { position: relative; z-index: 1; }
.lin-t { min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lin-t small { display: block; font-weight: 400; color: var(--mut); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.lin-v { text-align: right; white-space: nowrap; font: 400 20px/1 var(--f-tit); }
.lin-v small { font: 400 12.5px var(--f-corpo); color: var(--mut); margin-left: 5px; }
.lin-x { text-align: right; color: var(--mut); font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 10px; justify-content: flex-end; }
.lin[role="button"] { cursor: pointer; border-bottom: 1px solid var(--line); }
.lin[role="button"]:hover { background: var(--surf); }
.var { font-weight: 600; font-size: 13px; }
.var.sobe { color: var(--s-assinaram-t); } .var.desce { color: var(--s-cancel-t); }
.spark { color: var(--mut); flex: none; }

/* colunas */
.colunas { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; align-items: end; height: 220px; }
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
.col-b { width: 70%; max-width: 44px; height: calc(var(--p) * 150px); min-height: 2px; background: var(--line2); transform-origin: bottom; animation: sobe .8s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes sobe { from { transform: scaleY(0); } }
.col.rec .col-b { background: var(--ink); }
.col-v { font: 400 16px/1 var(--f-tit); margin-bottom: 6px; }
.col-x { font-size: 12px; color: var(--mut); margin-top: 8px; white-space: nowrap; }

/* tabela */
.tbl-wrap { overflow-x: auto; background: var(--surf); border: 1px solid var(--line); border-radius: 4px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl tr:last-child td, .tbl tr:last-child th { border-bottom: 0; }
.tbl th:first-child { text-align: left; }
.tbl thead th { color: var(--mut); font-weight: 500; font-size: 13px; }
.tbl tbody th { font-weight: 500; }
.nd { color: var(--mut); font-size: 12.5px; }

/* cofre */
.vault { max-width: 520px; padding: 28px 0 8px; }
.vault .lk { color: var(--ink2); margin-bottom: 10px; }
.vault-t { margin: 0 0 16px; font: 400 24px/1.2 var(--f-tit); }
.f-cofre { display: flex; gap: 10px; flex-wrap: wrap; }
.f-cofre input { flex: 1 1 220px; min-width: 0; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line2); background: transparent; outline: none; }
.f-cofre input:focus { border-bottom-color: var(--ink); }

/* busca geral */
.busca-g { position: fixed; inset: 0; z-index: 40; background: color-mix(in srgb, var(--ink) 30%, transparent); display: flex; justify-content: center; align-items: flex-start; padding: 6vh 16px 16px; }
.busca-g[hidden] { display: none; }
.busca-c { width: min(900px, 100%); max-height: 88vh; display: flex; flex-direction: column; background: var(--bg); border-radius: 4px; box-shadow: 0 24px 64px rgba(0, 0, 0, .18); overflow: hidden; animation: aparece .18s ease both; }
.busca-topo { display: flex; gap: 16px; align-items: center; padding: 18px 22px 10px; }
.busca.grande { flex: 1; margin: 0; }
.busca.grande input { font-size: 18px; padding-left: 32px; }
.busca-r { overflow-y: auto; padding: 4px 22px 22px; }
.busca-r .grupo { background: transparent; padding: 18px 0 8px; }
.busca-r .pes { background: var(--surf); padding: 12px 14px; border: 1px solid var(--line); border-top: 0; }
.busca-r .grupo + .pes { border-top: 1px solid var(--line); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); opacity: 0; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 2px; font-size: 14px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 50; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .passos { grid-template-columns: 1fr; }
  .passo { min-height: 0; grid-template-columns: 52px 1fr; grid-template-rows: none; column-gap: 14px; padding: 20px; }
  .passo-i { grid-row: 1 / span 4; margin: 4px 0 0; }
  .passo-n { font-size: 42px; }
  .passo-t { margin-top: 4px; }
  .passo-l { margin-top: 10px; }
}
@media (max-width: 640px) {
  .top-in { padding: 12px 16px 2px; }
  .marca { font-size: 21px; }
  .marca span { display: none; }
  .b-busca span { display: none; }
  .b-busca { padding: 9px; }
  main { padding: 26px 16px 72px; }
  .bloco { margin-bottom: 64px; }
  .metricas { grid-template-columns: repeat(2, 1fr); margin-bottom: 56px; }
  .met:nth-child(3) { border-left: 0; }
  .met:nth-child(n+3) { border-top: 1px solid var(--line); }
  .met { padding: 14px 12px 12px; }
  .met-v { font-size: 32px; }
  .rot-n { font-size: 19px; }
  .rot-l { font-size: 11.5px; }
  .filtro { grid-template-columns: 1fr; gap: 2px; }
  .filtro-o { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filtro-o::-webkit-scrollbar { display: none; }
  .filtro-o { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); padding-right: 24px; }
  .op { flex: none; }
  .pes { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 13px 14px; }
  .pes-a { grid-column: 2; grid-row: 1 / span 3; flex-direction: column; align-self: center; }
  .pes-q, .pes-s, .pes-c { grid-column: 1; }
  .lin { grid-template-columns: minmax(0, 1fr) auto; }
  .lin-x { grid-column: 1 / -1; justify-content: flex-start; margin-top: -6px; }
  .colunas { gap: 3px; }
  .col-v { font-size: 13px; }
  .col-x { font-size: 10.5px; }
  .busca-g { padding: 0; }
  .busca-c { max-height: 100vh; height: 100%; border-radius: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- acréscimos de 09/11: Hoje, ponte, modo noturno, impressão ---------- */
.b-cor { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line2); background: var(--surf); color: var(--ink2); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.b-cor:hover { border-color: var(--ink); }
.tabs button small { font-size: 11.5px; margin-left: 5px; color: var(--mut); font-weight: 500; }
.tabs button[aria-selected="true"] small { color: var(--ink); }
.btn.pri { background: var(--ink); color: var(--bg); }
.toast { background: var(--ink); color: var(--bg); }
.col.rec .col-b { background: var(--ink); }
.aviso { margin: -6px 0 22px; padding: 10px 14px; border-left: 2px solid var(--s-esperando); background: color-mix(in srgb, var(--s-esperando) 10%, transparent); font-size: 14px; }
.dl { font-size: 12px; color: var(--mut); }
.dl.bom { color: var(--s-assinaram-t); } .dl.ruim { color: var(--s-cancel-t); }
.foco { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin: 0 0 18px; }
.foco-b { border: 0; background: none; padding: 2px 0; font-size: 14px; color: var(--ink2); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line2); }
.foco-b b { font: 400 20px/1 var(--f-tit); color: var(--ink); margin-right: 3px; text-decoration: none; }
.foco-b:hover { text-decoration-color: var(--ink); }

/* Hoje */
.hoje-topo { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px; margin: 0 0 18px; }
.hoje-d { margin: 0; font: 400 22px/1.2 var(--f-tit); }
.hoje-p { margin: 0; color: var(--mut); font-size: 14px; }
.hoje-p b { font: 400 22px/1 var(--f-tit); color: var(--ink); }
.mini-barra.prog { grid-column: 1 / -1; height: 4px; }
.mini-barra.prog i { opacity: 1; }
.fases { margin-bottom: 16px; }
.hoje-l { display: grid; gap: 12px; }
.hc { background: var(--surf); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px; transition: opacity .18s, transform .18s; }
.hc.saindo { opacity: 0; transform: translateX(12px); }
.hc-cab { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: baseline; }
.hc-n { font: 400 22px/1 var(--f-tit); color: var(--mut); min-width: 22px; }
.hc-q b { display: block; font-weight: 600; font-size: 16px; }
.hc-q small { color: var(--mut); font-size: 13px; }
.hc-g { font-size: 12.5px; color: var(--mut); text-align: right; }
.hc-of { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin: 10px 0 0 34px; font-size: 14px; }
.hc-of b { font-weight: 600; }
.hc-c { color: var(--ink2); }
.hc-acao { display: flex; gap: 8px; margin: 14px 0 0 34px; }
.btn-acao { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; border-radius: 2px; font-size: 15px; font-weight: 500; text-decoration: none; }
.btn-acao.tel { background: var(--ink); color: var(--bg); }
.btn-acao.wa { background: #1f9d55; color: #fff; }
.hc-acao .ic { width: 46px; height: 46px; }
.hc-res { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 34px; align-items: center; }
.res { min-height: 42px; padding: 0 16px; border: 1px solid var(--line2); background: transparent; border-radius: 2px; font-size: 14px; cursor: pointer; }
.res:hover { border-color: var(--ink); }
.res.forte { border-color: var(--s-assinaram); color: var(--s-assinaram-t); }
.ret { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; flex-basis: 100%; font-size: 13.5px; color: var(--mut); margin-top: 4px; }
.op-d { border: 0; background: none; padding: 6px 0; font-size: 14px; color: var(--ink); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line2); }
.dt { border: 1px solid var(--line2); background: transparent; color: var(--ink); border-radius: 2px; padding: 6px 8px; font: inherit; font-size: 13.5px; }
.obs { flex-basis: 100%; border: 0; border-bottom: 1px solid var(--line2); background: transparent; padding: 8px 2px; outline: none; font-size: 14px; }
.obs:focus { border-bottom-color: var(--ink); }
.hc.feito { padding: 14px 20px; }
.hc.feito .hc-of { display: none; }
.hc-fim { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0 0 34px; }
.ponte { display: flex; align-items: center; gap: 8px; margin: 20px 0 0; font-size: 13.5px; color: var(--mut); }
.ponte i { width: 7px; height: 7px; border-radius: 50%; background: var(--mut); flex: none; }
.ponte.p-ok i { background: var(--s-assinaram); }
.ponte.p-enviando i { background: var(--acc); }
.ponte.p-erro i, .ponte.p-offline i { background: var(--s-esperando); }
.ponte.p-local i { background: var(--s-esperando); }
.hoje-cfg { margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 0; padding-top: 18px; }
.so-impressao { display: none; }

@media (max-width: 640px) {
  .hc { padding: 16px; }
  .hc-cab { grid-template-columns: auto minmax(0, 1fr); }
  .hc-g { grid-column: 2; text-align: left; }
  .hc-of, .hc-acao, .hc-res, .hc-fim { margin-left: 0; }
  .res { flex: 1 1 calc(50% - 8px); }
  .b-cor { width: 36px; height: 36px; }
}

/* impressão da fila: só a tabela, sem texto extra */
@media print {
  body { background: #fff !important; color: #000 !important; font-size: 11pt; }
  .top, .busca-g, .toast, main > .panel { display: none !important; }
  body.imprimir main > #p-hoje { display: block !important; animation: none; }
  body.imprimir #p-hoje > *:not(.so-impressao) { display: none !important; }
  .so-impressao { display: block !important; }
  .so-impressao h1 { font: 400 18pt/1.2 var(--f-tit); margin: 0 0 10pt; }
  .so-impressao table { width: 100%; border-collapse: collapse; }
  .so-impressao th, .so-impressao td { border-bottom: .6pt solid #999; padding: 6pt 5pt; text-align: left; vertical-align: top; }
  .so-impressao th { font-size: 9pt; color: #444; font-weight: 600; }
  .so-impressao td.cx { width: 34pt; } .so-impressao td.cx::before { content: ''; display: inline-block; width: 10pt; height: 10pt; border: .8pt solid #000; }
  .so-impressao td.ln { width: 120pt; }
  main { padding: 0; max-width: none; }
}

/* ações rápidas dos ativos */
.aps { display: flex; flex-wrap: wrap; gap: 6px; flex-basis: 100%; margin-top: 6px; }
.ap { min-height: 32px; padding: 0 12px; border: 1px solid var(--line2); background: transparent; border-radius: 2px; font-size: 13px; cursor: pointer; color: var(--ink); }
.ap:hover { border-color: var(--ink); }
.ap.forte { border-color: var(--s-assinaram); color: var(--s-assinaram-t); }
.ap.lnk { border: 0; padding: 0; min-height: 0; text-decoration: underline; text-underline-offset: 4px; }
.ap-ok { font-size: 13px; color: var(--s-assinaram-t); align-self: center; }

#b-atualiza.gira svg { animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.resolvidos { margin-top: 28px; }
.resolvidos summary { cursor: pointer; font-size: 14px; color: var(--mut); padding: 8px 0; }
.resolvidos summary small { margin-left: 6px; }
.resolvidos[open] summary { color: var(--ink); }
.top-in { gap: 8px; }

/* barras de rolagem lateral (abas e filtros): só andam para os lados, nunca puxam a página para cima ou para baixo */
.tabs, .filtro-o { touch-action: pan-x; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
.tabs { overflow-y: hidden; }
@media (max-width: 640px) {
  .filtro-o { overflow-y: hidden; scroll-snap-type: none; }
  .op, .tabs button { touch-action: pan-x; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
}

.hc-p small { display: block; color: var(--mut); font-size: 13px; }
.hc-of { flex-direction: column; gap: 2px; }

/* gatilhos da conversa */
.gat { list-style: none; margin: 12px 0 0 34px; padding: 10px 14px; border-left: 2px solid var(--acc); background: color-mix(in srgb, var(--acc) 7%, transparent); display: grid; gap: 6px; }
.gat li { font-size: 14px; line-height: 1.45; color: var(--ink2); }
.gat li b { color: var(--ink); font-weight: 600; }
@media (max-width: 640px) { .gat { margin-left: 0; } }

/* Direção C: "Vitrine". Cinza-claro de galeria, tinta quase preta e linhas finas, como a Gentle Monster;
   Hanken Grotesk leve no corpo e Instrument Serif nos títulos e números. As cores do CCAA ficam no logo,
   nos links e nas quatro situações. */
:root {
  --bg: #F3F4F6; --surf: #FFFFFF; --ink: #111111; --ink2: #343434; --mut: #5E5E5E; --line: #E5E7EB; --line2: #D4D7DC;
  --acc: #029CDC; --acc-txt: #0A6FA3; --marca: #C62219;
  --s-assinaram: #2E9E6A; --s-assinaram-t: #1B7A4E;
  --s-esperando: #D99A1E; --s-esperando-t: #8A5A00;
  --s-aberto: #B5BCC5; --s-aberto-t: #4F5661;
  --s-cancel: #B0378A; --s-cancel-t: #9A2577;
  --f-corpo: 'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif;
  --f-tit: 'Instrument Serif', 'Times New Roman', Georgia, serif;
}
/* modo noturno: automático pelo aparelho, ou escolhido no botão do topo */
@media (prefers-color-scheme: dark) {
  :root:not([data-cor="claro"]) {
    --bg: #121212; --surf: #1B1B1C; --ink: #F1F1EF; --ink2: #D5D5D2; --mut: #A3A3A0; --line: #2A2A2C; --line2: #3A3A3D;
    --acc-txt: #5CC2F0; --s-assinaram: #3FB57E; --s-assinaram-t: #5FD39B; --s-esperando: #E1A93A; --s-esperando-t: #F0C063;
    --s-aberto: #5C626B; --s-aberto-t: #B3BAC4; --s-cancel: #D45AAE; --s-cancel-t: #EE8DCF; color-scheme: dark;
  }
}
:root[data-cor="escuro"] {
  --bg: #121212; --surf: #1B1B1C; --ink: #F1F1EF; --ink2: #D5D5D2; --mut: #A3A3A0; --line: #2A2A2C; --line2: #3A3A3D;
  --acc-txt: #5CC2F0; --s-assinaram: #3FB57E; --s-assinaram-t: #5FD39B; --s-esperando: #E1A93A; --s-esperando-t: #F0C063;
  --s-aberto: #5C626B; --s-aberto-t: #B3BAC4; --s-cancel: #D45AAE; --s-cancel-t: #EE8DCF; color-scheme: dark;
}

</style>
</head>

        const n = Number((/\d+/.exec(of.det) || [])[0]) || 0;
        const faltam = 11 - n + 1;
        g.push(n ? `Já fez ${n - 1} ${n - 1 === 1 ? 'nível' : 'níveis'} com a gente. Faltam ${faltam} para concluir o English e fazer o TOEFL sem custo.` : 'Retoma de onde parou, sem perder o que já estudou.');
      }
      else if (['English Teen', 'Preteen'].includes(of.curso) && /^(Kids|Baby|Preteen)/i.test(x.nivel || '')) g.push(`Cresceu desde o ${esc(cursoDoNivel(x.nivel))}. Agora entra no ${esc(of.curso === 'English Teen' ? 'English Teen' : 'Preteen')}, com turma da mesma idade.`);

    if (g.length < 2 && hojeISO() <= '2026-12-30')  // campanha Cancún (base/docs/novidades-instagram-2026-10.md)

  const abertos = {};  // card -> etapa escolhida (atendeu / respondeu) enquanto o Pedro decide
  function cartao(item, i) {
    const x = item.x;
    const fase = faseDe(x);
    const k = chaveP(x.grupo, x.nome);
    const deHoje = regsDe(x.grupo, x.nome).filter((r) => r.dia === hojeISO());

    const cab = `<div class="hc-cab"><span class="hc-n">${i + 1}</span><div class="hc-q"><b>${esc(x.nome)}</b><small>${detalhe(x)}</small></div>

      <div class="hc-of"><span class="hc-p">${proposta(x.oferta)}</span>
      <span class="hc-c">Falar com ${esc(x.quem)}${x.parent && !/pr[oó]prio/i.test(x.parent) ? ` (${esc(x.parent.toLowerCase())})` : ''}</span></div>
      ${fase === 'feito' ? '' : (() => { const gs = gatilhos(item); return gs.length ? `<ul class="gat">${gs.map((t) => `<li>${t}</li>`).join('')}</ul>` : ''; })()}`;
    if (fase === 'feito') {
      return `<article class="hc feito" data-k="${esc(k)}">${cab}<div class="hc-fim"><span class="tag st-assinaram"><i></i>${esc(RESULT[ult.resultado] || ult.resultado)}${ult.motivo ? `: ${esc(ult.motivo.toLowerCase())}` : ''}${ult.retornar ? `. Retornar em ${dataBR(ult.retornar)}` : ''}</span>
        <button class="lnk" type="button" data-desfaz="${esc(ult.id)}">Desfazer</button></div></article>`;
    }
    const etapa = abertos[k];
    const canal = fase === 'ligar' ? 'ligacao' : 'whatsapp';
    const acao = fase === 'ligar'
      ? `<a class="btn-acao tel" href="tel:+${x.wa}">${IC.tel}Ligar ${esc(telBR(x.wa))}</a>`
      : `<a class="btn-acao wa" href="https://wa.me/${x.wa}" target="_blank" rel="noopener">${IC.wa}Abrir o WhatsApp</a>`;
    let botoes;
    if (!etapa) {
      botoes = fase === 'ligar'
        ? `<button class="res" type="button" data-etapa="atendeu">Atendeu</button><button class="res" type="button" data-res="nao_atendeu">Não atendeu</button><button class="res" type="button" data-res="numero_errado">Número errado</button>`
        : `<button class="res" type="button" data-etapa="respondeu">Respondeu</button><button class="res" type="button" data-res="sem_resposta">Sem resposta</button>`;
    } else {
      botoes = `<button class="res forte" type="button" data-res="interesse">Tem interesse</button><button class="res forte" type="button" data-res="visita">Agendou visita</button>
        <button class="res" type="button" data-res="pensar">Vai pensar</button><button class="res" type="button" data-res="sem_interesse">Sem interesse</button>
        <span class="ret">Combinar retorno <button class="op-d" type="button" data-ret="1">amanhã</button><button class="op-d" type="button" data-ret="3">em 3 dias</button><button class="op-d" type="button" data-ret="7">em 1 semana</button><input class="dt" type="date" min="${somaDias(1)}" aria-label="Escolher a data"></span>
        <input class="obs" type="text" maxlength="140" placeholder="Detalhe da conversa (opcional)" aria-label="Anotação">
        <button class="lnk" type="button" data-volta>Voltar</button>`;
    }
    return `<article class="hc ${fase}" data-k="${esc(k)}" data-canal="${canal}">${cab}<div class="hc-acao">${acao}${linkPlan(PRIV.gid[GID_DE[x.grupo]], x.linha)}</div>
      <div class="hc-res">${botoes}</div></article>`;
  }
  let faseHoje = 'ligar';
  function hoje() {
    const topo = titulo('Contatos de hoje', 'Ligue primeiro. Quem não atender, chame no WhatsApp em seguida.');

    return topo + aviso(PUB.ref.idade_inativos, 'inativos') + `
    <div class="hoje-topo">

  function impressao(fila) {

  }
  function resumoDoDia() {
    const hj = REG.filter((r) => r.dia === hojeISO() && !r.desfeito);
    const G = { inat: 'Inativos', tranc: 'Trancados', form: 'Formandos' };
    return `Follow-up de ${dataBR(hojeISO())}: ${hj.length} retornos\n` + hj.map((r) => `${G[r.grupo]} | ${r.aluno} | ${r.canal === 'ligacao' ? 'Ligação' : 'WhatsApp'} | ${RESULT[r.resultado] || r.resultado}${r.retornar ? ' | voltar em ' + dataBR(r.retornar) : ''}${r.obs ? ' | ' + r.obs : ''}`).join('\n');
  }

  // ---------- ações dos ativos (Assinaturas e Rematrícula) ----------
  // Cada toque grava na aba Ativos SPONTE, coluna Status rematrícula, pela ponte. Desfazer devolve o valor anterior.
  var regsAtivo = (x) => REG.filter((r) => !r.desfeito && r.grupo === 'ativo' && (r.mat ? r.mat === x.mat : norm(r.aluno) === norm(x.nome)));
  var STATUS_DE = { assinou: (x) => (x.tipo === 'Matrícula nova' ? 'Matriculado' : 'Rematriculado'), abordado: () => 'Abordado', disse_sim: () => 'Lançar rematrícula', cancelamento: () => 'Possível cancelamento' };
  function statusAtual(x) {
    const r = regsAtivo(x).filter((y) => STATUS_DE[y.resultado]).pop();
    return r ? { status: STATUS_DE[r.resultado](x), r } : { status: x.status, r: null };
  }
  const lembradoHoje = (x) => regsAtivo(x).some((r) => r.resultado === 'lembrete' && r.dia === hojeISO());
  const btAtivo = (x, res, rot, forte) => `<button type="button" class="ap${forte ? ' forte' : ''}" data-ativo="${res}" data-mat="${esc(x.mat)}" data-nome="${esc(x.nome)}" data-tipo="${esc(x.tipo || '')}" data-linha="${x.linha || ''}">${rot}</button>`;
  const desfazerAtivo = (r) => `<button type="button" class="ap lnk" data-desfaz="${esc(r.id)}">Desfazer</button>`;
  function acoesAssinatura(x) {
    const { r } = statusAtual(x);
    if (r && r.resultado === 'assinou') return `<span class="aps">${desfazerAtivo(r)}</span>`;
    return `<span class="aps">${btAtivo(x, 'assinou', 'Assinou', true)}${lembradoHoje(x) ? '<span class="ap-ok">Lembrado hoje</span>' : btAtivo(x, 'lembrete', 'Lembrei hoje')}</span>`;
  }
  function acoesRemat(x) {
    const { status, r } = statusAtual(x);
    if (r) return `<span class="aps">${desfazerAtivo(r)}</span>`;
    const b = [];
    if (status === 'Assinatura pendente') b.push(btAtivo(x, 'assinou', 'Assinou', true));
    if (status === 'Não abordado' || !status) b.push(btAtivo(x, 'abordado', 'Abordei'));
    if (status !== 'Assinatura pendente' && status !== 'Lançar rematrícula') b.push(btAtivo(x, 'disse_sim', 'Disse sim', true));
    if (status !== 'Possível cancelamento') b.push(btAtivo(x, 'cancelamento', 'Pode cancelar'));
    return `<span class="aps">${b.join('')}</span>`;
  }

  // ---------- pessoa (linha da lista) ----------
  function pessoa({ nome, sub, meio, contato, contatoSub, wa, gid, linha, q }) {
    return `<div class="pes">
      <div class="pes-q"><b>${marca(nome, q || '')}</b><small>${sub}</small></div>

      <div class="pes-a">${linkWa(wa)}${linkPlan(gid, linha)}</div></div>`;
  }
  const remPessoa = (x, q) => { const st = statusAtual(x).status; return pessoa({ nome: x.nome, sub: `${marca('Matrícula ' + x.mat, q)}${x.idade ? ', ' + x.idade + ' anos' : ''}`,
    meio: `${tag(chaveStatus(st), st)}${x.obs ? `<small>${esc(x.obs)}</small>` : ''}${acoesRemat(x)}`,
    contato: x.quem, contatoSub: `${x.parent}, ${rotLista(x.lista)}`, wa: x.wa, gid: PRIV.gid.ativos, linha: x.linha, q }); };

  // ---------- RESUMO ----------
  let selR = 'assinaram';
  function regua() {
    let acc = 0;
    const N = viva().N;
    const segs = ORDEM.map((k, i) => { const w = N[k] / SEGUEM * 100; const c = acc + w / 2; acc += w; return { k, w, c, i }; });
    const rot = (s) => {
      const lado = s.c < 12 ? 'ini' : s.c > 88 ? 'fim' : 'meio';
      return `<button class="rot rot-${lado} st-${s.k}" type="button" data-sel="${s.k}" aria-pressed="${selR === s.k}" style="--c:${s.c.toFixed(2)}%">
        <span class="rot-n">${nf(N[s.k])}<small>${pct(N[s.k], SEGUEM)}%</small></span><span class="rot-l"><i></i>${ST[s.k].rot}</span></button>`;
    };
    return `<div class="regua" role="group" aria-label="Alunos que seguem em 2027, por situação">
      <div class="rotulos cima">${segs.filter((s) => s.i % 2 === 0).map(rot).join('')}</div>
      <div class="barra">${segs.map((s) => `<button class="seg st-${s.k}" type="button" data-sel="${s.k}" aria-pressed="${selR === s.k}" aria-label="${ST[s.k].rot}: ${N[s.k]} alunos" style="flex-basis:${s.w.toFixed(3)}%"></button>`).join('')}</div>
      <div class="rotulos baixo">${segs.filter((s) => s.i % 2 === 1).map(rot).join('')}</div>
    </div>`;
  }
  function visao() {
    const QS = {
      assinaram: ['Como está cada lista?', 'Em destaque, quem já assinou o contrato 2027.'],
      esperando: ['Quem disse sim e falta assinar?', 'Em destaque, os contratos que esperam só a assinatura.'],
      aberto: ['Quem ainda está em aberto?', 'Não assinou nem disse sim. Só a Lista A registra quem já foi abordado.'],
      cancel: ['Quem pode cancelar?', 'Marcados como possível cancelamento na planilha.'],
      falta: ['Quem ainda não fechou 2027?', 'Em destaque, quem ainda não assinou, sem contar os de possível cancelamento.'],
    };
    const [q, sub] = QS[selR];
    const val = (e) => (selR === 'falta' ? e.alunos - eqN(e, 'assinaram') - e.cancel : eqN(e, selR));
    const rotSel = { assinaram: 'assinaram', esperando: 'esperando assinatura', aberto: 'em aberto', cancel: 'possível cancelamento', falta: 'faltam fechar' }[selR];
    const linhas = PUB.equipe.map((e) => `<div class="lista-l">
        <div class="lista-cab"><span class="lista-n">${esc(e.nome)}${e.atendente ? `<small>${esc(e.atendente)}</small>` : ''}</span>
          <span class="lista-v"><b>${nf(val(e))}</b> ${rotSel} <small>de ${nf(e.alunos)}</small></span></div>
        <div class="mini-barra">${ORDEM.map((k) => `<i class="st-${k}${(selR === k || (selR === 'falta' && (k === 'esperando' || k === 'aberto'))) ? ' on' : ''}" style="flex-basis:${(eqN(e, k) / e.alunos * 100).toFixed(2)}%"></i>`).join('')}</div>

    const mais = selR === 'assinaram' ? '' : `<button class="lnk" type="button" data-ir="rematricula" data-filtro="${selR}">Ver os alunos na aba Rematrícula</button>`;
    return `<section class="bloco visao" id="visao">${titulo(q, sub)}<div class="listas">${linhas}</div>${mais ? `<div class="acoes">${mais}</div>` : ''}</section>`;
  }
  function resumo() {
    const V = viva(), N = V.N;
    const KF = V.falta, KE = V.esperando;
    const A = PUB.anterior || {};
    const fila = PRIV ? filaDoDia().fila : null;
    const filaRest = fila ? fila.filter((f) => faseDe(f.x) !== 'feito').length : null;
    const docs = PUB.docs || {};
    return `
    <section class="hero">

      <p class="frase-sub">${nf(N.esperando)} já ${N.esperando === 1 ? 'disse' : 'disseram'} sim e só falta assinar. Toque num trecho da barra para ver cada lista.</p>

    </section>

      <button class="met${selR === 'falta' ? ' on' : ''}" type="button" data-sel="falta"><span class="met-r">Faltam fechar</span><span class="met-v">${num(KF)}</span>${delta(KF, A.falta, true)}</button>
      <button class="met" type="button" data-ir="followup" data-filtro="recentes"><span class="met-r">Inativos recentes sem contato</span><span class="met-v">${num(K.recentes_nao)}</span></button>
    </nav>
    ${visao()}
    <section class="bloco">
      ${titulo('O que fazer agora?', 'Do mais rápido de fechar para o mais demorado.')}
      <div class="passos">
        <button class="passo" type="button" data-ir="assinaturas" data-filtro="Não enviado"><span class="passo-i">${IC.contrato}</span><span class="passo-n">${nf(PRIV ? PRIV.assin.filter((x) => !assinouAgora(x) && x.doc === 'Não enviado').length : (docs['Não enviado'] || 0))}</span>
          <span class="passo-t">Enviar o contrato</span><span class="passo-d">Já disseram sim e o contrato ainda não foi enviado para assinar. Depende só de nós.</span><span class="passo-l">Ver quem é</span></button>
        <button class="passo" type="button" data-ir="assinaturas" data-filtro="Enviado"><span class="passo-i">${IC.assinar}</span><span class="passo-n">${nf(PRIV ? PRIV.assin.filter((x) => !assinouAgora(x) && x.doc === 'Enviado').length : (docs.Enviado || 0))}</span>

        <button class="passo" type="button" data-ir="hoje"><span class="passo-i">${IC.fila}</span><span class="passo-n">${filaRest == null ? nf(PREF.tam) : nf(filaRest)}</span>
          <span class="passo-t">Fila de hoje</span><span class="passo-d">Inativos e trancados para ligar hoje, família no CCAA e recentes primeiro.</span><span class="passo-l">Abrir a fila</span></button>

    </section>`;

  // ---------- ASSINATURAS ----------
  const fA = Object.assign({ lista: 'todas', doc: 'todos', tipo: 'todos', q: '' }, PREF.fA, { q: '' });
  const DOC = { 'Não enviado': 'Contrato não enviado', 'Enviado': 'Falta assinar', 'A conferir': 'Conferir no Sponte' };
  function assinaturas() {
    const topo = titulo('Quem disse sim e falta assinar?', 'Primeiro os contratos que ainda não foram enviados.');

    const base = PRIV.assin;

    const pend = PRIV.assin.filter((x) => !assinouAgora(x));
    const resolvidos = PRIV.assin.filter((x) => assinouAgora(x) && regsAtivo(x).some((r) => r.resultado === 'assinou' && r.dia === hojeISO()));
    const L = pend.filter((x) => (fA.lista === 'todas' || x.lista === fA.lista) && (fA.doc === 'todos' || x.doc === fA.doc)
      && (fA.tipo === 'todos' || x.tipo === fA.tipo) && casa(fA.q, [x.nome, x.mat, x.turma, x.quem, x.lista], x.mat + ' ' + x.wa));
    const cnt = (f) => pend.filter(f).length;
    return topo + `<div class="filtros">
      ${campoBusca('q-a', 'Buscar aluno, matrícula, turma ou responsável', fA.q)}
      ${filtro('Lista', 'lista', [['todas', 'Todas', pend.length], ...listas.map((l) => [l, rotLista(l), cnt((x) => x.lista === l)])], fA.lista)}
      ${filtro('Contrato', 'doc', [['todos', 'Todos'], ...Object.keys(DOC).map((d) => [d, DOC[d], cnt((x) => x.doc === d)])], fA.doc)}
      ${filtro('Tipo', 'tipo', [['todos', 'Todos'], ['Rematrícula', 'Rematrículas', cnt((x) => x.tipo === 'Rematrícula')], ['Matrícula nova', 'Matrículas novas', cnt((x) => x.tipo === 'Matrícula nova')]], fA.tipo)}
    </div>
    <p class="count">${L.length === 1 ? '1 contrato' : nf(L.length) + ' contratos'}</p>
    <div class="lista">${L.map((x) => pessoa({ nome: x.nome, sub: `${marca('Matrícula ' + x.mat, fA.q)}, ${esc(x.tipo)}`,
      meio: `${x.doc === 'Não enviado' ? '<span class="tag st-cancel"><i></i>Contrato não enviado</span>' : tag('esperando', DOC[x.doc] || x.doc)}<small>${marca(x.turma || 'Turma 2027 não informada', fA.q)}</small>${acoesAssinatura(x)}`,
      contato: x.quem || 'Contato não encontrado na planilha', contatoSub: `${x.parent}${x.lista !== 'Sem lista' ? ', ' + rotLista(x.lista) : ''}`,
      wa: x.wa, gid: PRIV.gid.ativos, linha: x.linha, q: fA.q })).join('') || `<p class="empty">${pend.length ? 'Nenhum contrato com esses filtros.' : 'Nenhum contrato esperando assinatura.'}</p>`}</div>
    ${resolvidos.length ? `<details class="resolvidos"><summary>Resolvidos hoje <small>${resolvidos.length}</small></summary><div class="lista">${resolvidos.map((x) => pessoa({ nome: x.nome, sub: `Matrícula ${esc(x.mat)}, ${esc(x.tipo)}`, meio: `${tag('assinaram', x.tipo === 'Matrícula nova' ? 'Matriculado' : 'Rematriculado')}${acoesAssinatura(x)}`, contato: x.quem, contatoSub: x.parent, wa: '', gid: PRIV.gid.ativos, linha: x.linha, q: '' })).join('')}</div></details>` : ''}`;
  }

  // ---------- REMATRÍCULA ----------
  const fR = Object.assign({ vista: 'alunos', lista: 'todas', st: 'todos', fam: 'todos', q: '' }, PREF.fR, { q: '' });
  function rematricula() {
    const turmas = fR.vista === 'turmas';
    const topo = titulo(turmas ? 'Como está cada turma?' : 'Quem ainda não fechou 2027?', turmas ? 'Turmas do 2º semestre de 2026, em ordem de curso. Toque numa turma para ver os alunos.' : 'Alunos que seguem em 2027 e ainda não assinaram, em ordem de curso e turma.')
      + `<div class="abas2" role="group" aria-label="Ver por"><button type="button" data-vista="alunos" aria-pressed="${!turmas}">Por aluno</button><button type="button" data-vista="turmas" aria-pressed="${turmas}">Por turma</button></div>`;
    if (!PRIV) return topo + cofre('A lista de alunos e turmas');
    if (turmas) {
      return topo + `<div class="lins">${PRIV.turmas.map((t) => `<div class="lin" role="button" tabindex="0" data-turma="${esc(t.turma)}">
        <span class="lin-bar st-assinaram" style="--p:${(t.fechados / t.total).toFixed(4)}"></span>
        <span class="lin-t">${esc(t.turma)}<small>Em 2027/1: ${esc(t.vai || 'turma ainda não definida')}</small></span>
        <span class="lin-v">${t.fechados} de ${t.total}<small>assinaram</small></span></div>`).join('')}</div>`;
    }
    const base = PRIV.remat.filter((x) => chaveStatus(statusAtual(x).status) !== 'assinaram');
    const listas = [...new Set(base.map((x) => x.lista))].filter((l) => l !== 'Sem lista').sort();
    const fams = [...new Set(base.map((x) => x.fam))].sort((a, b) => ordC(a) - ordC(b));
    const sts = [['todos', 'Todas'], ['esperando', 'Esperando assinatura'], ['aberto', 'Em aberto'], ['cancel', 'Possível cancelamento']];
    if (fR.lista === 'Lista A') sts.splice(3, 0, ['Abordado', 'Abordado'], ['Não abordado', 'Não abordado']);
    if (fR.lista !== 'Lista A' && (fR.st === 'Abordado' || fR.st === 'Não abordado')) fR.st = 'aberto';
    const okSt = (x) => {
      if (fR.st === 'todos') return true;
      const st = statusAtual(x).status;
      if (fR.st === 'Abordado') return st === 'Abordado' || st === 'Lançar rematrícula';
      if (fR.st === 'Não abordado') return st === 'Não abordado';
      return chaveStatus(st) === fR.st;
    };
    const L = base.filter((x) => (fR.lista === 'todas' || x.lista === fR.lista) && okSt(x) && (fR.fam === 'todos' || x.fam === fR.fam)
      && casa(fR.q, [x.nome, x.mat, x.turma, x.quem, x.lista], x.mat + ' ' + x.wa));
    const cnt = (f) => base.filter(f).length;
    let html = '', turmaAtual = null;
    for (const x of L.slice(0, 400)) {
      if (x.turma !== turmaAtual) { turmaAtual = x.turma; html += `<p class="grupo">${marca(x.turma || 'Sem turma', fR.q)}</p>`; }
      html += remPessoa(x, fR.q);
    }
    return topo + `<div class="filtros">
      ${campoBusca('q-r', 'Buscar aluno, matrícula, turma, responsável ou telefone', fR.q)}
      ${filtro('Lista', 'lista', [['todas', 'Todas', base.length], ...listas.map((l) => [l, rotLista(l), cnt((x) => x.lista === l)])], fR.lista)}
      ${filtro('Curso', 'fam', [['todos', 'Todos'], ...fams.map((f) => [f, f, cnt((x) => x.fam === f)])], fR.fam)}
      ${filtro('Situação', 'st', sts, fR.st)}
    </div>
    <p class="count">${L.length === 1 ? '1 aluno' : nf(L.length) + ' alunos'}</p>
    <div class="lista">${html || '<p class="empty">Nenhum aluno com esses filtros.</p>'}</div>`;
  }

  // ---------- FOLLOW-UP ----------
  const fF = Object.assign({ grupo: 'inat', of: 'todos', contato: 'nao', extra: 'todos', ano: 'todos', ordem: 'curso', q: '', n: 80 }, PREF.fF, { q: '', n: 80 });
  const semRot = (s) => (s ? s.slice(5) + '/' + s.slice(2, 4) : '');
  function ultimoRetorno(x, grupo) { const rs = regsDe(grupo, x.nome); return rs[rs.length - 1]; }
  const GRUPOS_F = [['inat', 'Inativos'], ['tranc', 'Trancados'], ['form', 'Formandos'], ['inter', 'Interessados']];
  const ORDENS = [['recentes', 'Mais recentes primeiro'], ['antigos', 'Mais antigos primeiro'], ['curso', 'Por curso'], ['az', 'A a Z']];
  function followup() {
    const contagem = { inat: K.inativos, tranc: K.tranc_lista, form: K.form_lista, inter: K.inter_lista || 0 };
    const topo = titulo('Quem chamar?', 'Escolha a situação, o ano, o curso e por onde começar. O que você marca aqui aparece em todos os aparelhos.')
      + `<div class="abas2" role="group" aria-label="Situação">${GRUPOS_F.map(([v, t]) => `<button type="button" data-fgrupo="${v}" aria-pressed="${fF.grupo === v}">${t}<small>${nf(contagem[v])}</small></button>`).join('')}</div>`;
    if (!PRIV) return topo + cofre('A lista de contatos');
    const G = fF.grupo;
    const base = G === 'inat' ? PRIV.inat : G === 'tranc' ? PRIV.tranc : G === 'form' ? PRIV.form : (PRIV.inter || []);
    const temCurso = G !== 'inter';
    const contatado = (x) => !!ultimoRetorno(x, G) || !naoContatadoPlanilha(x);
    const ofertas = temCurso ? [...new Set(base.map((x) => x.oferta.curso))].sort((a, b) => ordC(a) - ordC(b)) : [];
    if (fF.of !== 'todos' && !ofertas.includes(fF.of)) fF.of = 'todos';
    const anos = [...new Set(base.map(anoDe).filter(Boolean))].sort().reverse();
    if (fF.ano !== 'todos' && !anos.includes(fF.ano)) fF.ano = 'todos';
    if (!temCurso && fF.ordem === 'curso') fF.ordem = 'recentes';
    const ORD = {
      recentes: (a, b) => rk(b).localeCompare(rk(a)),
      antigos: (a, b) => (rk(a) || '9').localeCompare(rk(b) || '9'),
      curso: (a, b) => ordC(a.oferta.curso) - ordC(b.oferta.curso) || (b.familia ? 1 : 0) - (a.familia ? 1 : 0) || rk(b).localeCompare(rk(a)),
      az: () => 0,
    };
    const L = base.filter((x) => (fF.of === 'todos' || x.oferta.curso === fF.of)
      && (fF.ano === 'todos' || anoDe(x) >= fF.ano)
      && (fF.contato === 'todos' || (fF.contato === 'nao' ? !contatado(x) : contatado(x)))
      && (G !== 'inat' || fF.extra === 'todos' || (fF.extra === 'familia' ? x.familia : x.parou >= '2025-1'))
      && casa(fF.q, [x.nome, x.quem, x.nivel || '', x.turma || '', x.oferta.curso], (x.mat || '') + ' ' + x.wa))
      .sort((a, b) => ORD[fF.ordem](a, b) || a.nome.localeCompare(b.nome, 'pt'));
    followup.lista = L;
    const comTel = L.filter((x) => x.wa).length;
    const cnt = (f) => base.filter(f).length;
    const gid = PRIV.gid[GID_DE[G]];
    const teen = PRIV.inat.filter((x) => x.oferta.curso === 'English Teen' && !ultimoRetorno(x, 'inat') && naoContatadoPlanilha(x)).length;
    const espanol = PRIV.form.filter((x) => !ultimoRetorno(x, 'form') && naoContatadoPlanilha(x)).length;
    // cabeçalho dos blocos: curso (ordem por curso), ano (ordem por data) ou letra (A a Z)
    const cabDe = (x) => (fF.ordem === 'curso' ? rotOferta(x.oferta.curso) : fF.ordem === 'az' ? x.nome.charAt(0).toUpperCase() : (anoDe(x) || 'Sem ano'));
    let html = '', grupoAtual = null;
    for (const x of L.slice(0, fF.n)) {
      if (cabDe(x) !== grupoAtual) { grupoAtual = cabDe(x); html += `<p class="grupo">${esc(grupoAtual)}<small>${nf(L.filter((y) => cabDe(y) === grupoAtual).length)}</small></p>`; }
      const ult = ultimoRetorno(x, G);
      html += pessoa({ nome: x.nome, sub: G === 'tranc' ? `${marca('Matrícula ' + x.mat, fF.q)}${x.nivel ? ', ' + esc(x.nivel) : ''}${x.idade ? `, ${x.idade} anos hoje` : ''}` : detalhe(Object.assign({ grupo: G }, x)), q: fF.q,
        meio: `${x.oferta.det ? `<span class="oferta">${esc(x.oferta.det)}</span>` : ''}${x.familia ? '<span class="tag tag-fam"><i></i>Família no CCAA</span>' : ''}${ult ? `<span class="tag st-assinaram"><i></i>${esc(RESULT[ult.resultado] || ult.resultado)} em ${dataBR(ult.dia)}</span>` : `<span class="tag tag-neutra"><i></i>${esc(x.status)}</span>`}`,
        contato: x.quem, contatoSub: x.parent || 'contato', wa: x.wa, gid, linha: x.linha });
    }
    return topo + aviso(PUB.ref.idade_inativos, 'inativos') + `
    <div class="foco"><span class="filtro-r">Foco da temporada</span>
      <button class="foco-b" type="button" data-foco="teen"><b>${nf(teen)}</b> inativos na idade do English Teen 1</button>
      <button class="foco-b" type="button" data-foco="espanol"><b>${nf(espanol)}</b> formandos para o Español</button></div>
    <div class="filtros">
      ${campoBusca('q-f', 'Buscar nome, responsável, nível ou telefone', fF.q)}
      ${filtro('Começar por', 'ordem', ORDENS.filter(([v]) => temCurso || v !== 'curso'), fF.ordem)}
      ${anos.length ? filtro('Ano', 'ano', [['todos', 'Todos', base.length], ...anos.map((a) => [a, `De ${a} para cá`, cnt((x) => anoDe(x) >= a)])], fF.ano) : ''}
      ${temCurso ? filtro('Curso', 'of', [['todos', 'Todos', base.length], ...ofertas.map((o) => [o, rotOferta(o), cnt((x) => x.oferta.curso === o)])], fF.of) : ''}
      ${filtro('Contato', 'contato', [['nao', 'Nunca contatados', cnt((x) => !contatado(x))], ['sim', 'Já contatados', cnt(contatado)], ['todos', 'Todos']], fF.contato)}
      ${G === 'inat' ? filtro('Origem', 'extra', [['todos', 'Todos'], ['recentes', 'Pararam de 2025 para cá', cnt((x) => x.parou >= '2025-1')], ['familia', 'Família no CCAA', cnt((x) => x.familia)]], fF.extra) : ''}
    </div>
    <div class="count-l"><p class="count">${nf(L.length)} contatos, ${nf(comTel)} com WhatsApp</p><button class="lnk" type="button" id="b-copia">${IC.copia}Copiar os ${nf(comTel)} números</button></div>
    <div class="lista">${html || '<p class="empty">Nenhum contato com esses filtros.</p>'}</div>
    ${L.length > fF.n ? `<div class="acoes"><button class="btn" type="button" id="b-mais">Mostrar mais ${nf(Math.min(80, L.length - fF.n))} de ${nf(L.length - fF.n)}</button></div>` : ''}`;
  }

  // ---------- HISTÓRICO ----------
  function historico() {
    const H = PUB.hist;
    const ult = H.anos.length - 1;
    const maxT = Math.max(...H.total);
    const maxM = Math.max(...H.meses.map((m) => m[1]));
    const mesAtual = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][new Date().getMonth()];
    const totalAno = H.meses.reduce((s, m) => s + m[1], 0);
    const cursos = H.cursos.map((c) => ({ nome: c[0], v: c[1], d: c[1][ult] - c[1][ult - 1] })).sort((a, b) => ordC(a.nome) - ordC(b.nome));
    const maxU = Math.max(...cursos.map((c) => c.v[ult]));
    const temps = [...new Set(PUB.ritmo.map((r) => r.temporada))];
    const meses = ['out', 'nov', 'dez', 'jan', 'fev'];
    const R = (t, m) => (PUB.ritmo.find((r) => r.temporada === t && r.mes === m) || {}).rematriculas;
    const somaT = (t) => meses.reduce((s, m) => s + (R(t, m) || 0), 0);
    const spark = (v) => { const mx = Math.max(...v, 1); const pts = v.map((x, i) => `${(i / (v.length - 1) * 60).toFixed(1)},${(18 - x / mx * 16).toFixed(1)}`).join(' '); return `<svg class="spark" width="60" height="20" viewBox="0 0 60 20" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`; };
    const col = (rot, v, p, on) => `<div class="col${on ? ' rec' : ''}"><span class="col-v">${v}</span><span class="col-b" style="--p:${p.toFixed(4)}"></span><span class="col-x">${esc(rot)}</span></div>`;
    return `<div class="duas">
      <section class="bloco">${titulo('Quantas matrículas novas fizemos por ano?', 'Ano comercial de outubro a setembro.')}
        <div class="colunas" style="--n:${H.anos.length}">${H.anos.map((a, i) => col(a, H.total[i], H.total[i] / maxT, i === ult)).join('')}</div></section>
      <section class="bloco">${titulo('Em que meses as matrículas acontecem?', `Soma de cinco anos. Janeiro a março concentra ${pct(H.meses.slice(0, 3).reduce((s, m) => s + m[1], 0), totalAno)}% do ano.`)}
        <div class="colunas" style="--n:12">${H.meses.map((m) => col(m[0], m[1], m[1] / maxM, m[0] === mesAtual)).join('')}</div></section></div>
    <section class="bloco">${titulo('Quais cursos trazem alunos novos?', `Matrículas novas em ${esc(H.anos[ult])}, a variação contra ${esc(H.anos[ult - 1])} e a linha dos cinco anos, em ordem de curso.`)}
      <div class="lins">${cursos.map((c) => `<div class="lin"><span class="lin-bar" style="--p:${(c.v[ult] / maxU).toFixed(4)}"></span>
        <span class="lin-t">${esc(c.nome)}</span><span class="lin-v">${nf(c.v[ult])}</span>
        <span class="lin-x"><span class="var ${c.d > 0 ? 'sobe' : c.d < 0 ? 'desce' : ''}">${c.d > 0 ? '+' + c.d : c.d}</span>${spark(c.v)}</span></div>`).join('')}</div></section>
    <section class="bloco">${titulo('Quando as rematrículas acontecem?', 'Contratos de rematrícula por mês, de outubro a fevereiro de cada temporada.')}
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Temporada</th>${meses.map((m) => `<th scope="col">${m}</th>`).join('')}<th scope="col">Total</th></tr></thead>
      <tbody>${temps.map((t) => `<tr><th scope="row">${esc(t)}</th>${meses.map((m) => { const v = R(t, m); return `<td>${v == null ? '<span class="nd">sem dado</span>' : nf(v)}</td>`; }).join('')}<td><b>${nf(somaT(t))}</b></td></tr>`).join('')}</tbody></table></div></section>`;
  }

  // ---------- busca geral ----------
  function buscaGeral(q) {
    if (!PRIV) return cofre('A busca de alunos');
    if (norm(q).length < 2) return '<p class="empty">Digite parte do nome, a matrícula, a turma, o responsável ou o telefone.</p>';
    const grupos = [
      ['Ativos', PRIV.ativos.filter((x) => casa(q, [x.nome, x.mat, x.turma, x.quem], x.mat + ' ' + x.wa)).map((x) => ({ x, gid: PRIV.gid.ativos, sub: `${marca('Matrícula ' + x.mat, q)}, ${marca(x.turma, q)}`, meio: tag(chaveStatus(x.status), x.status) }))],
      ['Inativos', PRIV.inat.filter((x) => casa(q, [x.nome, x.quem, x.nivel], x.wa)).map((x) => ({ x, gid: PRIV.gid.inativos, sub: `Saiu do ${esc(x.nivel)} em ${semRot(x.parou)}`, meio: `<span class="oferta">Proposta: ${esc(x.oferta.curso)}</span>` }))],
      ['Trancados', PRIV.tranc.filter((x) => casa(q, [x.nome, x.quem, x.mat], x.mat + ' ' + x.wa)).map((x) => ({ x, gid: PRIV.gid.trancados, sub: marca('Matrícula ' + x.mat, q), meio: `<span class="oferta">Proposta: ${esc(rotOferta(x.oferta.curso))}</span>` }))],
      ['Formandos', PRIV.form.filter((x) => casa(q, [x.nome, x.quem, x.turma], x.wa)).map((x) => ({ x, gid: PRIV.gid.formandos, sub: `Concluiu em ${esc(x.concluiu)}`, meio: `<span class="oferta">Proposta: ${esc(rotOferta(x.oferta.curso))}</span>` }))],
    ].filter((g) => g[1].length);
    if (!grupos.length) return '<p class="empty">Ninguém encontrado. Tente só o primeiro nome ou os últimos dígitos do telefone.</p>';
    return grupos.map(([nome, R]) => `<p class="grupo">${nome}<small>${nf(R.length)}</small></p>` + R.slice(0, 12).map((r) => pessoa({ nome: r.x.nome, sub: r.sub, meio: r.meio,
      contato: r.x.quem, contatoSub: r.x.parent, wa: r.x.wa, gid: r.gid, linha: r.x.linha, q })).join('')).join('');
  }
  function abreBusca() {
    $('#busca-g').hidden = false;
    document.body.classList.add('sem-rolar');
    const i = $('#q-g'); i.value = ''; $('#busca-r').innerHTML = buscaGeral('');
    ligaCofre($('#busca-r'));
    setTimeout(() => i.focus(), 30);
  }
  function fechaBusca() { $('#busca-g').hidden = true; document.body.classList.remove('sem-rolar'); }
  $('#b-busca').addEventListener('click', abreBusca);
  $('#b-fecha').addEventListener('click', fechaBusca);
  $('#busca-g').addEventListener('click', (ev) => { if (ev.target.id === 'busca-g') fechaBusca(); });
  $('#q-g').addEventListener('input', (ev) => { clearTimeout(abreBusca.h); abreBusca.h = setTimeout(() => { $('#busca-r').innerHTML = buscaGeral(ev.target.value); ligaCofre($('#busca-r')); }, 120); });
  // atualizar: traz o que foi feito em outros aparelhos e confere se há versão nova do painel
  async function atualizar(silencioso) {
    const b = $('#b-atualiza');
    if (b) b.classList.add('gira');
    try {
      const html = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then((r) => r.text());
      const m = /"build":(\d+)/.exec(html);
      if (m && Number(m[1]) !== PUB.ref.build) { toast('Versão nova do painel. Recarregando…'); setTimeout(() => location.reload(), 600); return; }
    } catch (e) { /* sem internet: segue só com o que há */ }
    await sincroniza();
    if (b) b.classList.remove('gira');
    if (!silencioso) toast(estadoPonte === 'ok' ? 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : estadoPonte === 'local' ? 'Sem ponte com a planilha: só este aparelho' : 'Sem conexão com a planilha agora');
  }
  $('#b-atualiza').addEventListener('click', () => atualizar(false));
  setInterval(() => { if (!document.hidden && PRIV && PRIV.ponte && Date.now() - ultimaSync > 45000) sincroniza(); }, 15000);
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !$('#busca-g').hidden) fechaBusca();
    if (ev.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { ev.preventDefault(); abreBusca(); }
  });

  // ---------- modo noturno ----------
  function aplicaCor() {
    document.documentElement.dataset.cor = PREF.cor;
    const b = $('#b-cor');
    const T = { auto: ['auto', 'Cor: automática'], escuro: ['lua', 'Cor: escura'], claro: ['sol', 'Cor: clara'] }[PREF.cor];
    b.innerHTML = IC[T[0]]; b.setAttribute('aria-label', T[1]); b.title = T[1];
    const escuro = PREF.cor === 'escuro' || (PREF.cor === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    $('meta[name="theme-color"]').setAttribute('content', escuro ? '#121212' : '#F3F4F6');
  }
  $('#b-cor').addEventListener('click', () => { PREF.cor = { auto: 'escuro', escuro: 'claro', claro: 'auto' }[PREF.cor]; salvaPref(); aplicaCor(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicaCor);

  // ---------- navegação ----------
  const TELAS = { hoje, resumo, assinaturas, rematricula, followup, historico };
  let atual = 'resumo';
  function contadores() {
    const set = (tab, n) => { const b = $(`.tabs [data-tab="${tab}"]`); if (!b) return; let s = $('small', b); if (!s) { s = document.createElement('small'); b.append(s); } s.textContent = n ? nf(n) : ''; };
    set('assinaturas', PRIV ? PRIV.assin.filter((x) => !assinouAgora(x)).length : K.esperando);
    if (PRIV) { const { fila } = filaDoDia(); set('hoje', fila.filter((f) => faseDe(f.x) !== 'feito').length); } else set('hoje', 0);
  }
  function render(tab, suave) {
    const p = $('#p-' + tab);
    p.innerHTML = TELAS[tab]();
    if (!suave) { p.classList.remove('entra'); void p.offsetWidth; p.classList.add('entra'); contar(p); }
    ligaCofre(p);
    liga(tab, p);
    if (tab === 'hoje') pintaPonte();
  }
  function ir(tab, filtroIr) {
    if (filtroIr === 'familia') Object.assign(fF, { grupo: 'inat', extra: 'familia', contato: 'todos', of: 'todos', q: '', n: 80 });
    if (filtroIr === 'recentes') Object.assign(fF, { grupo: 'inat', extra: 'recentes', contato: 'nao', of: 'todos', q: '', n: 80 });
    if (tab === 'rematricula' && filtroIr) Object.assign(fR, { vista: 'alunos', st: filtroIr === 'falta' ? 'todos' : filtroIr, q: '', lista: 'todas', fam: 'todos' });
    if (tab === 'assinaturas' && filtroIr) Object.assign(fA, { doc: filtroIr, lista: 'todas', tipo: 'todos', q: '' });
    atual = tab;
    document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    document.querySelectorAll('.panel').forEach((p) => { p.hidden = p.id !== 'p-' + tab; });
    try { history.replaceState(null, '', '#' + tab); } catch (e) { /* ok */ }
    render(tab);
    window.scrollTo({ top: 0, behavior: reduz() ? 'auto' : 'smooth' });
  }
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => ir(b.dataset.tab)));

  function guardaFiltros() {
    PREF.fA = { lista: fA.lista, tipo: fA.tipo };
    PREF.fR = { vista: fR.vista, lista: fR.lista, fam: fR.fam };
    PREF.fF = { grupo: fF.grupo, of: fF.of, contato: fF.contato, ano: fF.ano, ordem: fF.ordem };
    salvaPref();
  }
  function liga(tab, p) {
    p.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => ir(b.dataset.ir, b.dataset.filtro)));
    p.querySelectorAll('[data-sel]').forEach((b) => b.addEventListener('click', () => {
      if (selR === b.dataset.sel) return;
      selR = b.dataset.sel;
      const y = window.scrollY;
      const v = $('#visao'); if (v) v.classList.add('saindo');
      setTimeout(() => { render(tab, true); window.scrollTo(0, y); }, reduz() ? 0 : 120);
    }));
    if (tab === 'hoje') return ligaHoje(p);
    p.querySelectorAll('[data-ativo]').forEach((b) => b.addEventListener('click', () => {
      const d = b.dataset;
      const r = registra({ grupo: 'ativo', nome: d.nome, mat: d.mat, tipo: d.tipo, linha: Number(d.linha) || 0 }, 'painel', d.ativo);
      toast((RESULT[r.resultado] || r.resultado) + (PRIV.ponte ? ': ' + d.nome.split(' ')[0] : '. Guardado neste aparelho'));
      const y = window.scrollY; render(tab, true); window.scrollTo(0, y);
    }));
    p.querySelectorAll('[data-desfaz]').forEach((b) => b.addEventListener('click', () => { desfaz(b.dataset.desfaz); toast('Desfeito'); const y = window.scrollY; render(tab, true); window.scrollTo(0, y); }));
    const F = { assinaturas: fA, rematricula: fR, followup: fF }[tab];
    if (!F) return;
    p.querySelectorAll('.op').forEach((b) => b.addEventListener('click', () => { F[b.dataset.grupo] = b.dataset.v; if (F === fF) fF.n = 80; guardaFiltros(); render(tab, true); }));
    p.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => { fR.vista = b.dataset.vista; guardaFiltros(); render(tab, true); }));
    p.querySelectorAll('[data-fgrupo]').forEach((b) => b.addEventListener('click', () => { Object.assign(fF, { grupo: b.dataset.fgrupo, of: 'todos', extra: 'todos', ano: 'todos', n: 80 }); guardaFiltros(); render(tab, true); }));
    p.querySelectorAll('[data-foco]').forEach((b) => b.addEventListener('click', () => {
      if (b.dataset.foco === 'teen') Object.assign(fF, { grupo: 'inat', of: 'English Teen', contato: 'nao', extra: 'todos', q: '', n: 80 });
      else Object.assign(fF, { grupo: 'form', of: 'todos', contato: 'nao', extra: 'todos', q: '', n: 80 });
      guardaFiltros(); render(tab, true);
    }));
    p.querySelectorAll('[data-turma]').forEach((b) => {
      const vai = () => { Object.assign(fR, { vista: 'alunos', q: b.dataset.turma, st: 'todos', lista: 'todas', fam: 'todos' }); render(tab, true); window.scrollTo(0, 0); };
      b.addEventListener('click', vai);
      b.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); vai(); } });
    });
    const i = $('.busca input', p);
    if (i) i.addEventListener('input', () => {
      clearTimeout(liga.h);
      liga.h = setTimeout(() => {
        F.q = i.value; if (F === fF) fF.n = 80; const pos = i.selectionStart; render(tab, true);
        const n = $('.busca input', $('#p-' + tab)); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ok */ }
      }, 160);
    });
    const mais = $('#b-mais', p);
    if (mais) mais.addEventListener('click', () => { const y = window.scrollY; fF.n += 80; render(tab, true); window.scrollTo(0, y); });
    const cp = $('#b-copia', p);
    if (cp) cp.addEventListener('click', () => copiar([...new Set((followup.lista || []).filter((x) => x.wa).map((x) => '+' + x.wa))].join('\n'), 'números copiados'));
  }
  async function copiar(texto, msg) {
    try { await navigator.clipboard.writeText(texto); toast(msg.replace(/^/, texto.split('\n').filter(Boolean).length + ' ')); }
    catch (e) { toast('Este navegador bloqueou a cópia. Tente pelo Chrome.'); }
  }
  function ligaHoje(p) {
    const re = () => { const y = window.scrollY; render('hoje', true); contadores(); window.scrollTo(0, y); };
    p.querySelectorAll('[data-fase]').forEach((b) => b.addEventListener('click', () => { faseHoje = b.dataset.fase; re(); }));
    p.querySelectorAll('.op[data-grupo="tam"]').forEach((b) => b.addEventListener('click', () => { PREF.tam = Number(b.dataset.v); salvaPref(); re(); }));
    p.querySelectorAll('[data-gr]').forEach((b) => b.addEventListener('click', () => {
      PREF.grupos[b.dataset.gr] = !PREF.grupos[b.dataset.gr];
      if (!Object.values(PREF.grupos).some(Boolean)) PREF.grupos.inat = true;
      salvaPref(); re();
    }));
    p.querySelectorAll('[data-desfaz]').forEach((b) => b.addEventListener('click', () => { desfaz(b.dataset.desfaz); toast('Retorno desfeito'); re(); }));
    const fila = PRIV ? filaDoDia().fila : [];
    const achar = (k) => fila.map((f) => f.x).find((x) => chaveP(x.grupo, x.nome) === k);
    p.querySelectorAll('.hc').forEach((c) => {
      const k = c.dataset.k;
      const x = achar(k);
      if (!x) return;
      const canal = c.dataset.canal;
      const fecha = (res, extra) => {
        const r = registra(x, canal, res, extra);
        delete abertos[k];
        toast((RESULT[res] || res) + (r.retornar ? `, voltar em ${dataBR(r.retornar)}` : '') + (PRIV.ponte ? '' : '. Guardado neste aparelho'));
        c.classList.add('saindo');
        setTimeout(re, reduz() ? 0 : 180);
      };
      c.querySelectorAll('[data-etapa]').forEach((b) => b.addEventListener('click', () => { abertos[k] = b.dataset.etapa; re(); }));
      c.querySelectorAll('[data-volta]').forEach((b) => b.addEventListener('click', () => { delete abertos[k]; re(); }));
      const obs = () => { const o = $('.obs', c); return o ? o.value.trim() : ''; };
      c.querySelectorAll('[data-res]').forEach((b) => b.addEventListener('click', () => {
        const res = b.dataset.res;
        const extra = { obs: obs() };
        if (res === 'sem_resposta' || res === 'pensar') extra.retornar = somaDias(3);  // tenta de novo em 3 dias
        if (res === 'nao_atendeu') { fecha(res, extra); return; }
        fecha(res, extra);
      }));
      c.querySelectorAll('[data-ret]').forEach((b) => b.addEventListener('click', () => fecha('retornar', { retornar: somaDias(Number(b.dataset.ret)), obs: obs() })));
      const dt = $('.dt', c);
      if (dt) dt.addEventListener('change', () => { if (dt.value) fecha('retornar', { retornar: dt.value, obs: obs() }); });
    });
    const imp = $('#b-imprime', p);
    if (imp) imp.addEventListener('click', () => { document.body.classList.add('imprimir'); window.print(); setTimeout(() => document.body.classList.remove('imprimir'), 500); });
    const rs = $('#b-resumo', p);
    if (rs) rs.addEventListener('click', () => copiar(resumoDoDia(), 'linhas copiadas. Cole aqui no chat do Claude'));
  }

  // ---------- início ----------
  aplicaCor();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  (async () => {
    const hash = location.hash || '';
    const k = chaveDe(hash);
    let tab = (hash.match(/^#(hoje|resumo|assinaturas|rematricula|followup|historico)$/) || [])[1] || '';
    if (k) {
      const ok = await abrir(k);
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      if (ok) toast('Contatos abertos neste aparelho');
    } else {
      let salvo = null; try { salvo = localStorage.getItem(LS.k); } catch (e) { /* ok */ }
      if (salvo && !(await abrir(salvo))) { try { localStorage.removeItem(LS.k); } catch (e) { /* ok */ } }
    }
    if (!tab) tab = PRIV ? 'hoje' : 'resumo';
    ir(tab);
    contadores();
    sincroniza();
    window.addEventListener('hashchange', async () => {
      const k2 = chaveDe(location.hash);
      if (!k2) return;
      const ok2 = await abrir(k2);
      try { history.replaceState(null, '', location.pathname); } catch (e) { /* ok */ }
      sincroniza(); render(atual); contadores(); toast(ok2 ? 'Contatos abertos neste aparelho' : 'Link não reconhecido. Confira se colou o link inteiro.');
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden && PRIV) sincroniza(); });
  })();
})();

</script>
</body>
</html>
